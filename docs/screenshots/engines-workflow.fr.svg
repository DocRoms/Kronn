<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"
     role="img" aria-labelledby="eng-title eng-desc"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Un workflow sur trois couloirs de moteurs. Fond sombre propre, lisible
       pareil en thème GitHub clair ou sombre. -->
  <title id="eng-title">Un workflow, n'importe quel moteur à chaque étape : les mêmes quatre étapes sur un couloir cloud, un couloir 100 % local et un couloir hybride</title>
  <desc id="eng-desc">
    Exemple : créer le premier visuel du projet à partir de son design system. Le workflow lit les design tokens du projet, sa charte, son logo et un échantillon de palette. Quatre étapes de gauche à droite : un, écrire le prompt ; deux, le relire ; trois, générer l'image à partir du prompt et d'images de référence ; quatre, transformer l'image en vidéo. Couloir cloud, payant : Claude Code écrit, Codex relit, LiteLLM ou OpenRouter génère l'image, OpenRouter fait la vidéo. Couloir 100 % local : Ollama avec Qwen écrit, un second modèle Ollama relit, ComfyUI génère l'image et, sur une machine très puissante, la vidéo. Couloir hybride : Claude Code écrit là où le raisonnement compte, Ollama relit gratuitement et en privé, ComfyUI génère l'image pour que les fichiers de marque (logo, palette) ne quittent jamais la machine, OpenRouter fait la vidéo là où le matériel local manque. Les couleurs indiquent le type de moteur.
  </desc>

  <rect x="0" y="0" width="1200" height="640" fill="#0d1117"/>

  <style>
    .title  { font-size: 22px; font-weight: 700; fill: #f9fafb; }
    .label  { font-size: 15px; font-weight: 700; fill: #f9fafb; }
    .small  { font-size: 12px; fill: #d1d5db; }
    .tiny   { font-size: 11px; fill: #9ca3af; font-style: italic; }
    .num    { font-size: 13px; font-weight: 800; fill: #0d1117; }
    .stage  { font-size: 14px; font-weight: 700; fill: #f9fafb; }
    .row-h  { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #f9fafb; }
    .kind   { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .cli    { fill: #fbbf24; }
    .http   { fill: #a78bfa; }
    .local  { fill: #34d399; }
  </style>

  <text x="600" y="34" text-anchor="middle" class="title">Un workflow, n'importe quel moteur à chaque étape</text>

  <g role="group" aria-label="Contexte projet lu par le workflow">
    <rect x="210" y="52" width="960" height="34" rx="8" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.7" stroke-dasharray="5 3"/>
    <text x="690" y="74" text-anchor="middle" class="small">Contexte projet : design tokens · charte · logo · échantillon de palette</text>
  </g>

  <g role="group" aria-label="Les quatre étapes">
    <circle cx="232" cy="112" r="12" fill="#f9fafb"/><text x="232" y="117" text-anchor="middle" class="num">1</text>
    <text x="252" y="117" class="stage">Prompt</text>
    <circle cx="479" cy="112" r="12" fill="#f9fafb"/><text x="479" y="117" text-anchor="middle" class="num">2</text>
    <text x="499" y="117" class="stage">Relecture</text>
    <circle cx="726" cy="112" r="12" fill="#f9fafb"/><text x="726" y="117" text-anchor="middle" class="num">3</text>
    <text x="746" y="117" class="stage">Image</text>
    <circle cx="973" cy="112" r="12" fill="#f9fafb"/><text x="973" y="117" text-anchor="middle" class="num">4</text>
    <text x="993" y="117" class="stage">Vidéo</text>
  </g>

  <text x="30" y="172" class="row-h">Cloud</text>
  <text x="30" y="190" class="small">payant, rien</text>
  <text x="30" y="206" class="small">à installer</text>

  <g role="group" aria-label="Couloir Cloud, étape 1 : Claude Code">
    <rect x="210" y="136" width="219" height="96" rx="10" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="226" y="157" class="kind cli">Agent CLI</text>
    <text x="226" y="180" class="label">Claude Code</text>
    <text x="226" y="201" class="small">écrit le prompt</text>
    <text x="226" y="218" class="small">depuis les tokens</text>
  </g>
  <g role="group" aria-label="Couloir Cloud, étape 2 : Codex">
    <rect x="457" y="136" width="219" height="96" rx="10" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="473" y="157" class="kind cli">Agent CLI</text>
    <text x="473" y="180" class="label">Codex</text>
    <text x="473" y="201" class="small">vérifie qu'il respecte</text>
    <text x="473" y="218" class="small">la marque</text>
  </g>
  <g role="group" aria-label="Couloir Cloud, étape 3 : LiteLLM / OpenRouter">
    <rect x="704" y="136" width="219" height="96" rx="10" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="720" y="157" class="kind http">Fournisseur HTTP</text>
    <text x="720" y="180" class="label">LiteLLM / OpenRouter</text>
    <text x="720" y="201" class="small">prompt + images</text>
    <text x="720" y="218" class="small">de référence</text>
  </g>
  <g role="group" aria-label="Couloir Cloud, étape 4 : OpenRouter">
    <rect x="951" y="136" width="219" height="96" rx="10" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="967" y="157" class="kind http">Fournisseur HTTP</text>
    <text x="967" y="180" class="label">OpenRouter</text>
    <text x="967" y="201" class="small">l'image en</text>
    <text x="967" y="218" class="small">première frame</text>
  </g>

  <text x="30" y="298" class="row-h">100 % local</text>
  <text x="30" y="316" class="small">chaque modèle</text>
  <text x="30" y="332" class="small">sur ta machine</text>

  <g role="group" aria-label="Couloir 100 % local, étape 1 : Ollama · Qwen">
    <rect x="210" y="262" width="219" height="96" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5"/>
    <text x="226" y="283" class="kind local">Local</text>
    <text x="226" y="306" class="label">Ollama · Qwen</text>
    <text x="226" y="327" class="small">écrit le prompt</text>
    <text x="226" y="344" class="small">depuis les tokens</text>
  </g>
  <g role="group" aria-label="Couloir 100 % local, étape 2 : Ollama">
    <rect x="457" y="262" width="219" height="96" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5"/>
    <text x="473" y="283" class="kind local">Local</text>
    <text x="473" y="306" class="label">Ollama</text>
    <text x="473" y="327" class="small">un second modèle</text>
    <text x="473" y="344" class="small">vérifie la marque</text>
  </g>
  <g role="group" aria-label="Couloir 100 % local, étape 3 : ComfyUI">
    <rect x="704" y="262" width="219" height="96" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5"/>
    <text x="720" y="283" class="kind local">Local</text>
    <text x="720" y="306" class="label">ComfyUI</text>
    <text x="720" y="327" class="small">prompt + images</text>
    <text x="720" y="344" class="small">de référence</text>
  </g>
  <g role="group" aria-label="Couloir 100 % local, étape 4 : ComfyUI">
    <rect x="951" y="262" width="219" height="96" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="967" y="283" class="kind local">Local</text>
    <text x="967" y="306" class="label">ComfyUI *</text>
    <text x="967" y="327" class="small">l'image en</text>
    <text x="967" y="344" class="small">première frame</text>
  </g>

  <text x="30" y="424" class="row-h">Hybride</text>
  <text x="30" y="442" class="small">chaque étape sur</text>
  <text x="30" y="458" class="small">son meilleur moteur</text>

  <g role="group" aria-label="Couloir Hybride, étape 1 : Claude Code">
    <rect x="210" y="388" width="219" height="96" rx="10" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="226" y="409" class="kind cli">Agent CLI</text>
    <text x="226" y="432" class="label">Claude Code</text>
    <text x="226" y="453" class="small">le raisonnement compte :</text>
    <text x="226" y="470" class="small">un agent solide</text>
  </g>
  <g role="group" aria-label="Couloir Hybride, étape 2 : Ollama">
    <rect x="457" y="388" width="219" height="96" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5"/>
    <text x="473" y="409" class="kind local">Local</text>
    <text x="473" y="432" class="label">Ollama</text>
    <text x="473" y="453" class="small">relecture gratuite</text>
    <text x="473" y="470" class="small">et privée</text>
  </g>
  <g role="group" aria-label="Couloir Hybride, étape 3 : ComfyUI">
    <rect x="704" y="388" width="219" height="96" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5"/>
    <text x="720" y="409" class="kind local">Local</text>
    <text x="720" y="432" class="label">ComfyUI</text>
    <text x="720" y="453" class="small">logo et palette ne</text>
    <text x="720" y="470" class="small">quittent pas la machine</text>
  </g>
  <g role="group" aria-label="Couloir Hybride, étape 4 : OpenRouter">
    <rect x="951" y="388" width="219" height="96" rx="10" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="967" y="409" class="kind http">Fournisseur HTTP</text>
    <text x="967" y="432" class="label">OpenRouter</text>
    <text x="967" y="453" class="small">la vidéo, là où le</text>
    <text x="967" y="470" class="small">matériel local manque</text>
  </g>

  <g aria-hidden="true">
    <path d="M 429 184 L 451 184" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="457,184 448,180 448,188" fill="#d1d5db"/>
    <path d="M 676 184 L 698 184" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="704,184 695,180 695,188" fill="#d1d5db"/>
    <path d="M 923 184 L 945 184" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="951,184 942,180 942,188" fill="#d1d5db"/>
    <path d="M 429 310 L 451 310" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="457,310 448,306 448,314" fill="#d1d5db"/>
    <path d="M 676 310 L 698 310" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="704,310 695,306 695,314" fill="#d1d5db"/>
    <path d="M 923 310 L 945 310" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="951,310 942,306 942,314" fill="#d1d5db"/>
    <path d="M 429 436 L 451 436" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="457,436 448,432 448,440" fill="#d1d5db"/>
    <path d="M 676 436 L 698 436" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="704,436 695,432 695,440" fill="#d1d5db"/>
    <path d="M 923 436 L 945 436" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="951,436 942,432 942,440" fill="#d1d5db"/>
  </g>

  <g role="group" aria-label="Légende : types de moteur">
    <rect x="210" y="532" width="14" height="14" rx="3" fill="#fbbf24"/>
    <text x="232" y="544" class="small">Agent CLI (modèle cloud)</text>
    <rect x="470" y="532" width="14" height="14" rx="3" fill="#a78bfa"/>
    <text x="492" y="544" class="small">Fournisseur HTTP (cloud)</text>
    <rect x="730" y="532" width="14" height="14" rx="3" fill="#34d399"/>
    <text x="752" y="544" class="small">Modèle ou média local</text>
  </g>

  <text x="600" y="586" text-anchor="middle" class="small">
    Exemple : le premier visuel du projet à partir de son design system. Mêmes quatre étapes : seul le moteur de chaque étape change.
  </text>
  <text x="600" y="616" text-anchor="middle" class="tiny">
    * La vidéo locale demande une machine très puissante ; c'est quasi impossible même sur un bon Mac.
  </text>
</svg>
