<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kronn">
  <!-- Redrawn from the 0.13.0 logo rather than embedded as a raster: a favicon
       is read at 16px, where a downscaled photo turns to mud and a path does
       not. Same geometry as `desktop/src-tauri/icons/icon.svg` and the
       `KronnMark` component the app header draws. -->
  <rect width="512" height="512" fill="#0b0f22"/>
  <defs>
    <!-- One diagonal run for the whole frame: cyan at the top-right of the
         crown, magenta at the left flank and foot, blue-violet between. -->
    <linearGradient id="kronn-frame" gradientUnits="userSpaceOnUse"
                    x1="441" y1="60" x2="84" y2="470">
      <stop offset="0" stop-color="#2ad6f0"/>
      <stop offset="0.45" stop-color="#7b6cf5"/>
      <stop offset="1" stop-color="#cc4df2"/>
    </linearGradient>
    <linearGradient id="kronn-top" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7ceef2"/><stop offset="1" stop-color="#22c4e2"/>
    </linearGradient>
    <linearGradient id="kronn-hub" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#c9aef2"/><stop offset="1" stop-color="#4a86e8"/>
    </linearGradient>
    <linearGradient id="kronn-peer" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f4cbee"/><stop offset="1" stop-color="#9b6ef0"/>
    </linearGradient>
  </defs>
  <!-- Hexagon: shallow crown, vertical flanks, tapered foot. -->
  <path d="M256 60 L429 152 V380 L256 470 L84 380 V152 Z"
        fill="none" stroke="url(#kronn-frame)" stroke-width="25" stroke-linejoin="round"/>
  <!-- The orbit around the graph, broken where the three nodes sit. -->
  <g fill="none" stroke="url(#kronn-frame)" stroke-width="12" stroke-linecap="round">
    <path d="M148.4 257.6 A 108 108 0 0 1 210.4 169.1"/>
    <path d="M301.6 169.1 A 108 108 0 0 1 363.6 257.6"/>
    <path d="M318 355.5 A 108 108 0 0 1 194 355.5"/>
  </g>
  <!-- The graph it guards: one hub, three peers, the links between them. -->
  <g fill="none" stroke="url(#kronn-frame)" stroke-width="9" stroke-linecap="round">
    <path d="M256 273 V165"/>
    <path d="M256 273 L157 316"/>
    <path d="M256 273 L356 316"/>
  </g>
  <circle cx="256" cy="165" r="33" fill="url(#kronn-top)"/>
  <circle cx="157" cy="316" r="29" fill="url(#kronn-peer)"/>
  <circle cx="356" cy="316" r="29" fill="url(#kronn-peer)"/>
  <circle cx="256" cy="273" r="50" fill="url(#kronn-hub)"/>
</svg>
