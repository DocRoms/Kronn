# pnpm 11 split a few config keys out of `package.json` into this
# workspace file:
#
# - `allowBuilds` — explicit allowlist for transitive packages that run
#   install scripts. Vetted entries:
#     • sharp: native libvips bindings pulled via @huggingface/transformers
#       (image preprocessing for the local model surface).
#     • onnxruntime-node: native ORT runtime via vits-web (TTS).
#     • protobufjs: postinstall codegen for the gRPC client transitively
#       pulled by onnxruntime.
#   NOTE (0.8.11): onnxruntime-node's postinstall additionally tries to
#   download CUDA GPU binaries from api.nuget.org on linux-x64 — never
#   used (browser app → onnxruntime-web; CPU binaries are bundled) and
#   the download times out on GitHub runners (THE recurring CI flake).
#   It is skipped via ONNXRUNTIME_NODE_INSTALL=skip in ci-test.yml (env)
#   and frontend/Dockerfile — the build itself stays allowed here.
#   Re-vet any addition — pnpm 11 errors out (ERR_PNPM_IGNORED_BUILDS,
#   exit 1) on `pnpm install --frozen-lockfile` if a build-script dep
#   is missing from this list, so CI catches drift.
#
# - `overrides` — force-patch versions for known-vuln transitive deps.
#   Moved here from `package.json#pnpm.overrides` in 0.8.1 because pnpm
#   11 reads workspace.yaml as the source of truth and compares its
#   content against the lockfile (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH
#   otherwise). Drop each entry once the direct upstream dep picks it
#   up. Each floor is the first release that fixes every advisory reported
#   for that transitive dependency by `pnpm audit`; floors were last refreshed
#   on 2026-08-10. Major
#   overrides (`adm-zip`, `brace-expansion`, `sharp`) are covered by the full
#   frontend test/build gate because their parents have not released patched
#   constraints yet.
allowBuilds:
  onnxruntime-node: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - postcss@8.5.23
  - brace-expansion@5.0.9
  - mermaid@11.16.1
  - dompurify@3.4.13
  - nanoid@3.3.18
overrides:
  adm-zip: '0.6.0'
  postcss: '8.5.23'
  flatted: '>=3.4.2'
  brace-expansion: '5.0.9'
  dompurify: '3.4.13'
  protobufjs: '7.6.5'
  sharp: '0.35.0'
