[package]
name = "kronn-l3"
description = "Kronn backend, layer 3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "kronn_l3"
path = "../../src/layer3.rs"

[features]
default = ["full-tests"]
full-tests = []
# Test helpers of this crate, for the tests of the crates above it.
test-support = ["dep:tempfile", "dep:serial_test", "dep:http-body-util", "kronn-l0/test-support", "kronn-l1/test-support", "kronn-l2/test-support"]

[dependencies]
serial_test = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
kronn-l0 = { path = "../l0" }
kronn-l1 = { path = "../l1" }
kronn-l2 = { path = "../l2" }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
csv = { workspace = true }
rusqlite = { workspace = true }
cron = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
walkdir = { workspace = true }
open = { workspace = true }
which = { workspace = true }
libc = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
keyring = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
fs2 = { workspace = true }
reqwest = { workspace = true }
serde_json_path = { workspace = true }
governor = { workspace = true }
secrecy = { workspace = true }
tokio-tungstenite = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
regex-lite = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
inventory = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
calamine = { workspace = true }
zip = { workspace = true }
pdf-extract = { workspace = true }
ts-rs = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
html5ever = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
errno = { workspace = true }

[dev-dependencies]
kronn-l0 = { path = "../l0", features = ["test-support"] }
kronn-l1 = { path = "../l1", features = ["test-support"] }
kronn-l2 = { path = "../l2", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
http-body-util = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures = { workspace = true }
wiremock = { workspace = true }
walkdir = { workspace = true }
proptest = { workspace = true }
