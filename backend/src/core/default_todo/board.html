  .recherche input { width: 100%; font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 0.42rem 2.6rem 0.42rem 1.9rem; }
  .recherche input::placeholder { color: var(--muted); }
  .recherche input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .recherche input::-webkit-search-cancel-button { display: none; }
  .recherche-vider { position: absolute; right: 0.3rem; border: none; background: none; color: var(--muted); border-radius: 5px; padding: 0.1rem 0.4rem; font-size: 1rem; line-height: 1; }
  .recherche-vider:hover { color: var(--ink); background: var(--chip); }
  .recherche-vider[hidden] { display: none; }
  .raccourci { position: absolute; right: 0.5rem; font: 0.7rem var(--mono); color: var(--muted); border: 1px solid var(--grid); border-radius: 4px; padding: 0 0.3rem; pointer-events: none; }
  .raccourci[hidden] { display: none; }

  .pastille { width: 0.55rem; height: 0.55rem; border-radius: 50%; display: inline-block; }
  .col-todo .pastille { background: var(--col-todo); } .col-in_progress .pastille { background: var(--col-doing); } .col-done .pastille { background: var(--col-done); }

  .cartes { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  .carte { background: var(--surface); border: 1px solid var(--grid); border-radius: 9px; padding: 0.6rem 0.7rem 0.5rem; display: grid; gap: 0.4rem; transition: border-color 0.12s, box-shadow 0.12s; min-width: 0; }

  .carte.en-attente { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .fin-cible { min-height: 1.4rem; border-radius: 6px; }
  .ligne1 { display: flex; gap: 0.4rem; align-items: flex-start; }
  .poignee { color: var(--muted); font-size: 0.85rem; line-height: 1.45; user-select: none; opacity: 0.55; transition: opacity 0.12s; }
  .carte:hover .poignee, .carte:focus-within .poignee { opacity: 1; }
  .titre { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; font-size: 0.93rem; line-height: 1.4; }
  .chevron { flex: none; border: 1px solid var(--grid); background: none; border-radius: 6px; width: 1.6rem; height: 1.45rem; padding: 0; color: var(--ink-2); line-height: 1; font-size: 0.9rem; }
  .chevron:hover { color: var(--ink); border-color: var(--grid); }
  .chevron svg { width: 0.9rem; height: 0.9rem; vertical-align: middle; transition: transform 0.12s; }
  .chevron[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .chevron[aria-expanded="true"] svg { transform: rotate(180deg); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.5rem; font-size: 0.74rem; color: var(--muted); }
  .prio { font-weight: 600; border-radius: 4px; padding: 0 0.35rem; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid currentColor; }
  .prio-critical { color: var(--bad); } .prio-high { color: var(--warn); } .prio-low { color: var(--muted); }
  .lien-disc { color: var(--accent); text-decoration: none; border-radius: 4px; padding: 0 0.15rem; }
  .lien-disc:hover { text-decoration: underline; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .tag { font: 0.68rem var(--mono); color: var(--ink-2); background: var(--chip); border: 1px solid var(--grid); border-radius: 999px; padding: 0.05rem 0.5rem; }
  .tag:hover { border-color: var(--accent); color: var(--accent); }
  .apercu { color: var(--ink-2); font-size: 0.84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .details { color: var(--ink-2); font-size: 0.85rem; overflow-wrap: anywhere; border-top: 1px solid var(--grid); padding-top: 0.45rem; }
  .details > :first-child { margin-top: 0; } .details > :last-child { margin-bottom: 0; }
  .details h1, .details h2, .details h3, .details h4, .details h5, .details h6 { font-size: 0.9rem; margin: 0.6rem 0 0.25rem; color: var(--ink); text-transform: none; letter-spacing: 0; }

  .details pre { background: var(--code); border-radius: 6px; padding: 0.45rem 0.55rem; overflow-x: auto; }
  .details pre code { background: none; padding: 0; }
  .details a { color: var(--accent); }
  .pied { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; padding-top: 0.1rem; }

<div class="wrap">
  <!-- Anchor for Kronn's action cards: without it they hang off the button, at its width. -->
  <div class="entete" data-kronn-action-slot-host>
    <div class="tete">
      <h1><span id="titre-page"></span><span class="compte" id="compte"></span></h1>
      <div class="outils">
        <button class="btn" type="button" id="rafraichir" data-kronn-action="todo-refresh"></button>
        <button class="ajouter" type="button" id="ajouter" data-kronn-action="todo-add"></button>
      </div>
    </div>
    <div class="recherche" role="search">
      <svg class="recherche-icone" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/></svg>
      <input type="search" id="recherche" autocomplete="off" spellcheck="false" />
      <kbd class="raccourci" id="raccourci" aria-hidden="true">/</kbd>
      <button class="recherche-vider" type="button" id="recherche-vider" hidden>×</button>
    </div>
  </div>
  <div class="avis" id="avis" role="note" hidden>
    <div class="avis-texte"><p id="avis-texte"></p><p id="aide-confiance"></p></div>
    <button class="avis-fermer" type="button" id="avis-fermer">✕</button>
  </div>
  <p class="statut" id="statut" role="status" aria-live="polite"></p>
  <div class="tableau" id="tableau"></div>
  <p class="aide" id="aide"></p>
</div>

      emptyCol: '这里暂时还没有内容', noMatch: '没有卡片符合搜索条件。', search: '搜索任务或标签…', searchAria: '搜索待办', clearSearch: '清除搜索', filterTag: '按此标签筛选', prio: { critical: '紧急', high: '高', low: '低' }, updated: '更新于', created: '创建于', linked: '已关联讨论', of: '/',
      todo: '待办', in_progress: '进行中', done: '已完成',
      emptyTodo: '没有待办。点击“+ 添加”记下下一件事。', emptyDoing: '没有进行中的任务。把卡片拖到这里或点 ▶。', emptyDone: '最近没有完成的任务。',
      countTodo: '待办', countDoing: '进行中',
      details: '显示详情', hideDetails: '隐藏详情', edit: '编辑标题和描述', top: '移到列首',
      toDoing: '开始', toTodo: '移回待办', markDone: '标记为完成', reopen: '重新打开',
      discuss: '发起讨论', openDiscussion: '查看讨论',
      validate: '确认移动', cancel: '取消', waiting: '等待在 Kronn 卡片中确认。',
      moveFailed: '移动未保存：操作失败，卡片已回到原位。',
      help: '把卡片拖到其他位置或列。▶ ◀ 无需拖动即可移动，⤒ 移到列首，✎ 编辑，⌄ 显示描述。',
      trustHint: '若想拖放后无需确认卡片即可保存，请在此页面详情中批准一次 “todo-move” 操作（可信操作）。'
    }
  };
  var T = DICT[LANG] || DICT.en;
  var COLUMNS = ['todo', 'in_progress', 'done'];

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

  // Minimal Markdown: the text is escaped FIRST, so only the tags built here
  // reach the DOM; a link keeps only an http(s) target.
  function inline(text) {
    var codes = [];
    var out = text.replace(/`([^`\n]+)`/g, function (_m, code) { codes.push(code); return '\u0000' + (codes.length - 1) + '\u0000'; });
    out = out.replace(/\[([^\]\n]+)\]\(((?:[^()\s]|\([^()\s]*\))+)\)/g, function (m, label, url) {
      if (!/^https?:\/\//i.test(url)) return label;
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    });
    out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^\w])__([^_\n]+)__(?!\w)/g, '$1<strong>$2</strong>');
    out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>').replace(/(^|[^\w_])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
    return out.replace(/\u0000(\d+)\u0000/g, function (_m, i) { return '<code>' + codes[Number(i)] + '</code>'; });
  }
  function markdown(source) {
    var lines = esc(source).replace(/\r\n?/g, '\n').split('\n');
    var html = [], para = [], list = null, i = 0;
    function flushPara() { if (para.length) { html.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    function flushList() { if (list) { html.push('<' + list.tag + '>' + list.items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</' + list.tag + '>'); list = null; } }
    while (i < lines.length) {
      var line = lines[i], m;
      if (/^\s*```/.test(line)) {
        flushPara(); flushList();
        var code = [];
        i += 1;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i]); i += 1; }
        html.push('<pre><code>' + code.join('\n') + '</code></pre>');
        i += 1;
        continue;
      }
      if ((m = /^\s{0,3}(#{1,6})\s+(.*)$/.exec(line))) {
        flushPara(); flushList();
        html.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>');
      } else if ((m = /^\s*[-*+]\s+(.*)$/.exec(line)) || (m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) {
        flushPara();
        var tag = /^\s*\d/.test(line) ? 'ol' : 'ul';
        if (list && list.tag !== tag) flushList();
        if (!list) list = { tag: tag, items: [] };
        list.items.push(m[1]);
      } else if (!line.trim()) {
        flushPara(); flushList();
      } else {
        flushList();
        para.push(line.trim());
      }
      i += 1;
    }
    flushPara(); flushList();
    return html.join('');
  }
  window.KronnTodoMarkdown = markdown;

  function marker(c) { return '__col_' + c + '__'; }
  function binding(o) { return esc(JSON.stringify(o)); }
  var rows = [];
  var pending = null;   // a move shown before Kronn saved it: { id, before, column, ... }
  var open = {};        // cards whose details are expanded, by id
  var dragged = null;
  var tableau = document.getElementById('tableau');
  var statut = document.getElementById('statut');

  function columnOf(r) { return r.column === 'in_progress' || r.column === 'done' ? r.column : 'todo'; }
  function inColumn(c) { return rows.filter(function (r) { return columnOf(r) === c; }); }
  function shown(c) {
    var list = inColumn(c);
    if (!pending) return list;
    list = list.filter(function (r) { return r.id !== pending.id; });
    if (pending.column !== c) return list;
    var me = rows.filter(function (r) { return r.id === pending.id; })[0];
    if (!me) { pending = null; return inColumn(c); }
    var at = list.map(function (r) { return r.id; }).indexOf(pending.before);
    list.splice(at < 0 ? list.length : at, 0, me);
    return list;
  }
  // A move the published board already shows is no longer pending.
  function applied() {
    if (!pending) return;
    var me = rows.filter(function (r) { return r.id === pending.id; })[0];
    if (!me) { pending = null; return; }
    if (columnOf(me) !== pending.column) return;
    if (pending.column === 'done') { pending = null; return; }
    var ids = inColumn(pending.column).map(function (r) { return r.id; });
    var i = ids.indexOf(me.id);
    if (pending.before === marker(pending.column) ? i === ids.length - 1 : ids[i + 1] === pending.before) pending = null;
  }

  function moveButton(cls, label, aria, task, before, column) {
    return '<button class="' + cls + '" type="button" data-kronn-action="todo-move" data-kronn-bindings="' +
      binding({ task: task, before: before, column: marker(column) }) + '" aria-label="' + esc(aria) + '" title="' + esc(aria) + '">' + esc(label) + '</button>';
  }

  // Accent- and case-insensitive text, for the search.
  function fold(text) { return String(text == null ? '' : text).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  var search = document.getElementById('recherche');
  function query() { return fold(search.value).trim(); }
  function matches(r, q) {
    if (!q) return true;
    var hay = fold([r.title, r.description, r.ref].concat(Array.isArray(r.tags) ? r.tags : []).join('\n'));
    return q.split(/\s+/).every(function (word) { return hay.indexOf(word) >= 0; });
  }
  // The first line of a description, without its Markdown marks.
  function preview(text) {
    var line = String(text || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean)[0] || '';
    return line.replace(/^#{1,6}\s+|^[-*+]\s+|^\d+[.)]\s+|^```.*$/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*_`]/g, '');
  }
  var RELATIVE = (function () { try { return new Intl.RelativeTimeFormat(LANG, { numeric: 'auto' }); } catch (x) { return null; } })();
  function ago(iso) {
    var at = Date.parse(iso || '');
    if (!isFinite(at)) return '';
    var seconds = (at - Date.now()) / 1000, abs = Math.abs(seconds);
    var units = [[60, 'second', 1], [3600, 'minute', 60], [86400, 'hour', 3600], [2592000, 'day', 86400], [31536000, 'month', 2592000], [Infinity, 'year', 31536000]];
    for (var k = 0; k < units.length; k += 1) {
      if (abs < units[k][0]) {
        var value = Math.round(seconds / units[k][2]);
        return RELATIVE ? RELATIVE.format(value, units[k][1]) : new Date(at).toLocaleDateString();
      }
    }
    return '';
  }
  function chip(tag) {
    return '<button class="tag" type="button" data-tag="' + esc(tag) + '" title="' + esc(T.filterTag) + '">#' + esc(tag) + '</button>';
  }

  function card(r, c, i, list) {
    var mine = pending && pending.id === r.id;
    var tags = Array.isArray(r.tags) && r.tags.length ? '<div class="tags">' + r.tags.map(chip).join('') + '</div>' : '';
    var hasDesc = Boolean((r.description || '').trim());
    var expanded = hasDesc && open[r.id];
    var chevron = hasDesc ? '<button class="chevron" type="button" data-details="' + esc(r.id) + '" aria-expanded="' + (expanded ? 'true' : 'false') +
      '" aria-label="' + esc((expanded ? T.hideDetails : T.details) + ' — ' + r.title) + '" title="' + esc(expanded ? T.hideDetails : T.details) + '">' + '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button>' : '';
    var body = !hasDesc ? '' : expanded
      ? '<div class="details">' + markdown(r.description) + '</div>'
      : '<div class="apercu">' + esc(preview(r.description)) + '</div>';
    var meta = [];
    if (r.priority && T.prio[r.priority]) meta.push('<span class="prio prio-' + esc(r.priority) + '">' + esc(T.prio[r.priority]) + '</span>');
    var when = ago(r.updated_at || r.created_at);
    if (when) meta.push('<time datetime="' + esc(r.updated_at || r.created_at) + '" title="' + esc((r.updated_at ? T.updated : T.created) + ' ' + new Date(Date.parse(r.updated_at || r.created_at)).toLocaleString()) + '">' + esc(when) + '</time>');
    if (r.discussion_id) meta.push('<a class="lien-disc" href="#discussion-' + encodeURIComponent(r.discussion_id) + '" target="_blank" rel="noopener noreferrer" title="' + esc(T.openDiscussion) + '" aria-label="' + esc(T.linked + ' — ' + r.title) + '">💬 ' + esc(T.linked) + ' ↗</a>');
    var foot = '<span class="ref">' + esc(r.ref || '') + '</span>';
    if (mine) {
      foot = '<div class="attente">' + moveButton('placer', T.validate, T.validate + ' — ' + r.title, r.id, pending.before, pending.column) +
        '<button class="btn" type="button" data-cancel>' + esc(T.cancel) + '</button>' +
        (pending.waiting ? '<span class="note">' + esc(T.waiting) + '</span>' : '') + '</div>';
    } else {
      if (!r.discussion_id) foot += '<button class="btn" type="button" data-kronn-action="todo-discuss" data-kronn-bindings="' + binding({ task: r.id }) + '" title="' + esc(T.discuss) + '" aria-label="' + esc(T.discuss + ' — ' + r.title) + '">💬</button>';
      foot += '<button class="btn" type="button" data-kronn-action="todo-edit" data-kronn-bindings="' + binding({ task: r.id }) + '" title="' + esc(T.edit) + '" aria-label="' + esc(T.edit + ' — ' + r.title) + '">✎</button>';
      if (c !== 'done' && i > 0) foot += moveButton('btn', '⤒', T.top + ' — ' + r.title, r.id, list[0].id, c);
      if (c === 'todo') foot += moveButton('btn', '▶', T.toDoing + ' — ' + r.title, r.id, marker('in_progress'), 'in_progress');
      if (c === 'in_progress') foot += moveButton('btn', '◀', T.toTodo + ' — ' + r.title, r.id, marker('todo'), 'todo');
      foot += c === 'done'
        ? '<button class="btn" type="button" data-kronn-action="todo-toggle" data-kronn-bindings="' + binding({ task: r.id }) + '" title="' + esc(T.reopen) + '" aria-label="' + esc(T.reopen + ' — ' + r.title) + '">↺</button>'
        : '<button class="btn fait" type="button" data-kronn-action="todo-toggle" data-kronn-bindings="' + binding({ task: r.id }) + '" title="' + esc(T.markDone) + '" aria-label="' + esc(T.markDone + ' — ' + r.title) + '">✓</button>';
    }
    return '<li class="carte' + (mine ? ' en-attente' : '') + '" draggable="true" data-id="' + esc(r.id) + '" data-colonne="' + c + '">' +
      '<div class="ligne1"><span class="poignee" aria-hidden="true">⠿</span><span class="titre">' + esc(r.title) + '</span>' + chevron + '</div>' +
      (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '') +
      body + tags + '<div class="pied">' + foot + '</div></li>';
  }

  function render() {
    applied();
    var hints = { todo: T.emptyTodo, in_progress: T.emptyDoing, done: T.emptyDone };
    var q = query();
    tableau.innerHTML = COLUMNS.map(function (c) {
      var all = shown(c);
      var list = all.filter(function (r) { return matches(r, q) || (pending && pending.id === r.id); });
      var count = q && all.length ? list.length + ' ' + T.of + ' ' + all.length : String(list.length);
      var empty = q && all.length
        ? '<li class="vide">' + esc(T.noMatch) + '</li>'
        : '<li class="vide"><strong>' + esc(T.emptyCol) + '</strong><span>' + esc(hints[c]) + '</span></li>';
      return '<section class="colonne col-' + c + '" data-colonne="' + c + '" aria-label="' + esc(T[c]) + '">' +
        '<div class="col-tete"><h2><span class="pastille" aria-hidden="true"></span>' + esc(T[c]) + '</h2><span class="n" data-count="' + c + '">' + esc(count) + '</span></div>' +
        '<ol class="cartes">' + (list.length ? list.map(function (r, i) { return card(r, c, i, all); }).join('') : empty) +
        '<li class="fin-cible" data-fin="' + c + '" aria-hidden="true"></li></ol></section>';
    }).join('');
    var nTodo = inColumn('todo').length, nDoing = inColumn('in_progress').length;
    document.getElementById('compte').textContent = [nTodo ? nTodo + ' ' + T.countTodo : '', nDoing ? nDoing + ' ' + T.countDoing : ''].filter(Boolean).join(' · ');
  }

  // Search is display-only: it filters what is drawn, never launches anything.
  var vider = document.getElementById('recherche-vider');
  var raccourci = document.getElementById('raccourci');
  function searchChanged() {
    vider.hidden = !search.value;
    raccourci.hidden = Boolean(search.value);
    render();
  }
  function setSearch(value) { search.value = value; searchChanged(); }
  search.addEventListener('input', searchChanged);
  search.addEventListener('keydown', function (e) { if (e.key === 'Escape' && search.value) { e.stopPropagation(); setSearch(''); } });
  vider.addEventListener('click', function () { setSearch(''); search.focus(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    e.preventDefault();
    search.focus();
  });

  function rollback(message) {
    pending = null;
    statut.textContent = message || '';
    render();
  }

  // The pending move's own button carries the state of its launch, marked by
  // Kronn: a launch that fails puts the card back; one never started leaves
  // the card waiting for its confirmation card.
  var FAILED = { failed: 1, preflight_failed: 1, cancelled: 1, expired: 1 };
  new MutationObserver(function (records) {
    if (!pending) return;
    records.forEach(function (rec) {
      var el = rec.target;
      if (!pending || !el.classList || !el.classList.contains('placer')) return;
      var state = el.getAttribute('data-kronn-action-state');
      var launch = el.getAttribute('data-kronn-action-launch');
      if (pending.baseline === undefined) return;
      if (state === 'launching' || state === 'running') { pending.launch = launch; return; }
      var ours = launch && (launch === pending.launch || launch !== pending.baseline);
      if (!ours) return;
      if (FAILED[state]) rollback(T.moveFailed);
      else if (state === 'succeeded') pending.succeeded = true;
    });
  }).observe(tableau, { subtree: true, attributes: true, attributeFilter: ['data-kronn-action-state', 'data-kronn-action-launch'] });

  function propose(move) {
    statut.textContent = '';
    pending = move;
    render();
    var confirm = tableau.querySelector('.carte.en-attente .placer');
    if (!confirm) return;
    // A state Kronn marks right after this render belongs to an older launch.
    setTimeout(function () { if (pending === move) move.baseline = confirm.getAttribute('data-kronn-action-launch'); }, 0);
    // Still inside the drop gesture: Kronn runs an approved move without its card.
    confirm.click();
    setTimeout(function () {
      if (pending === move && !move.launch && !move.succeeded) { move.waiting = true; render(); }
    }, 1500);
  }

  function clearMarks() { Array.prototype.forEach.call(tableau.querySelectorAll('.cible, .survol, .glisse'), function (x) { x.classList.remove('cible', 'survol', 'glisse'); }); }
  tableau.addEventListener('dragstart', function (e) {
    var li = e.target.closest && e.target.closest('li[data-id]');
    if (!li) return;
    dragged = li.getAttribute('data-id');
    li.classList.add('glisse');
    try { e.dataTransfer.setData('text/plain', dragged); e.dataTransfer.effectAllowed = 'move'; } catch (x) { /* no dataTransfer */ }
  });
  tableau.addEventListener('dragend', function () { dragged = null; clearMarks(); });
  tableau.addEventListener('dragover', function (e) {
    if (!dragged) return;
    var col = e.target.closest && e.target.closest('.colonne');
    if (!col) return;
    e.preventDefault();
    var li = e.target.closest('li[data-id], li[data-fin]') || col.querySelector('li[data-fin]');
    clearMarks();
    col.classList.add('survol');
    if (li) li.classList.add('cible');
  });
  tableau.addEventListener('drop', function (e) {
    if (!dragged) return;
    var col = e.target.closest && e.target.closest('.colonne');
    if (!col) return;
    e.preventDefault();
    var c = col.getAttribute('data-colonne');
    var li = e.target.closest('li[data-id]');
    var before = li && li.getAttribute('data-id') !== dragged ? li.getAttribute('data-id') : marker(c);
    var id = dragged;
    dragged = null;
    clearMarks();
    var me = rows.filter(function (r) { return r.id === id; })[0];
    if (!me) return;
    var ids = inColumn(c).map(function (r) { return r.id; });
    var i = ids.indexOf(id);
    // Dropped on its own place: nothing to move.
    if (columnOf(me) === c && (before === id || (i >= 0 && (ids[i + 1] === before || (before === marker(c) && i === ids.length - 1))))) return;
    propose({ id: id, before: before, column: c });
  });
  tableau.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('[data-cancel]')) { rollback(''); return; }
    var chipEl = e.target.closest('[data-tag]');
    if (chipEl) { setSearch(chipEl.getAttribute('data-tag')); return; }
    var d = e.target.closest('[data-details]');
    if (d) { var id = d.getAttribute('data-details'); open[id] = !open[id]; render(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pending) rollback(''); });

  function dataset(root) {
    if (!root || typeof root !== 'object') return null;
    var v = root.datasets && root.datasets.todo !== undefined ? root.datasets.todo : root.todo;
    if (v && !Array.isArray(v) && v.current !== undefined) v = v.current;
    return v;
  }
  function boot(root) {
    var v = dataset(root);
    rows = Array.isArray(v) ? v.filter(function (r) { return r && r.id && !r.sentinel; }) : [];
    // A launch that succeeded without moving the card (changed elsewhere) ends here.
    if (pending && pending.succeeded) { applied(); if (pending) pending = null; }
    render();
    showNotice(root);
  }

  document.getElementById('titre-page').textContent = T.title;
  document.getElementById('ajouter').textContent = T.add;
  document.getElementById('ajouter').setAttribute('aria-label', T.addAria);
  document.getElementById('rafraichir').textContent = T.refresh;
  document.getElementById('rafraichir').setAttribute('aria-label', T.refreshAria);
  document.getElementById('rafraichir').setAttribute('title', T.refreshAria);
  document.getElementById('aide').textContent = T.help;
  search.setAttribute('placeholder', T.search);
  search.setAttribute('aria-label', T.searchAria);
  vider.setAttribute('aria-label', T.clearSearch);
  vider.setAttribute('title', T.clearSearch);
  document.getElementById('aide-confiance').textContent = T.trustHint;
  // Read once, dismissed for good for this viewer. The sandbox has no storage:
  // Kronn keeps the flag (KronnPagePref) and hands it back with the data.
  var NOTICE_KEY = 'kronn-todo-notice-dismissed';
  var avis = document.getElementById('avis');
  var closedHere = false;
  function locallyDismissed() { try { return window.localStorage.getItem(NOTICE_KEY) === '1'; } catch (x) { return false; } }
  function showNotice(root) {
    var kept = Boolean(root && root.prefs && root.prefs['notice-dismissed'] === true);
    avis.hidden = closedHere || kept || locallyDismissed();
  }
  document.getElementById('avis-texte').textContent = T.notice;
  var fermer = document.getElementById('avis-fermer');
  fermer.setAttribute('aria-label', T.closeNotice);
  fermer.setAttribute('title', T.closeNotice);
  fermer.addEventListener('click', function () {
    closedHere = true;
    avis.hidden = true;
    try { if (typeof window.KronnPagePref === 'function') window.KronnPagePref('notice-dismissed', true); } catch (x) { /* host without preferences */ }
    try { window.localStorage.setItem(NOTICE_KEY, '1'); } catch (x) { /* refused in the sandbox */ }
  });
  boot(window.KronnPageData);
  window.addEventListener('kronn:page-data', function (e) { boot((e && e.detail) || window.KronnPageData); });
})();
</script>
