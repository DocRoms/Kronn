# Every child process is built in `core::cmd`, which gives it the environment
# of its route (KT-1006, design note agent-secret-boundary §9). Constructing
# or spawning a process any other way would inherit the backend's environment.
# `allow-invalid`: libc paths absent on one platform (vfork on macOS, all on
# Windows), and the desktop-only entries (tauri), kept so both files ban the
# same set.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "use core::cmd::{sync_cmd, git_cmd, sync_tool_cmd} with a ChildRoute" },
    { path = "tokio::process::Command::new", reason = "use core::cmd::{async_cmd, async_git_cmd, tool_cmd} with a ChildRoute" },
    { path = "std::env::var", reason = "read through core::child_env::var (the desktop withholds variables)" },
    { path = "std::env::var_os", reason = "read through core::child_env::var_os (the desktop withholds variables)" },
    { path = "std::env::vars", reason = "read through core::child_env::vars_os (the desktop withholds variables)" },
    { path = "std::env::vars_os", reason = "read through core::child_env::vars_os (the desktop withholds variables)" },
    { path = "open::that", reason = "use core::cmd::open_in_system" },
    { path = "open::that_detached", reason = "use core::cmd::open_in_system" },
    { path = "open::that_in_background", reason = "use core::cmd::open_in_system" },
    { path = "open::with", reason = "use core::cmd::open_in_system" },
    { path = "open::with_detached", reason = "use core::cmd::open_in_system" },
    { path = "open::with_in_background", reason = "use core::cmd::open_in_system" },
    { path = "open::commands", reason = "use core::cmd::open_in_system" },
    { path = "open::with_command", reason = "use core::cmd::open_in_system" },
    { path = "libc::execvpe", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::execl", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::execle", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::execlp", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::fexecve", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::popen", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::clone", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::syscall", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::forkpty", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::execveat", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::execvP", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::rfork", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::execlpe", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::wexecl", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::wexecle", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::wexeclp", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::wexeclpe", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::wexecv", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::wexecve", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::wexecvp", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::wexecvpe", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::exect", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::pdfork", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::daemon", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::fork", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::vfork", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::execv", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::execve", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::execvp", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::posix_spawn", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::posix_spawnp", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "libc::system", reason = "spawn through core::cmd", allow-invalid = true },
    { path = "tauri_plugin_shell::Shell::command", reason = "spawn through kronn::core::cmd", allow-invalid = true },
    { path = "tauri_plugin_shell::Shell::sidecar", reason = "spawn through kronn::core::cmd", allow-invalid = true },
    { path = "tauri_plugin_shell::open::open", reason = "use kronn::core::cmd::open_in_system", allow-invalid = true },
    { path = "tauri_plugin_shell::Shell::open", reason = "use kronn::core::cmd::open_in_system", allow-invalid = true },
    { path = "tauri::AppHandle::restart", reason = "relaunch through kronn::core::cmd::full_env_sync_cmd (SelfRestart)", allow-invalid = true },
    { path = "tauri::AppHandle::request_restart", reason = "relaunch through kronn::core::cmd::full_env_sync_cmd (SelfRestart)", allow-invalid = true },
    { path = "tauri::process::restart", reason = "relaunch through kronn::core::cmd::full_env_sync_cmd (SelfRestart)", allow-invalid = true },
]
