[package]
name = "kronn"
version.workspace = true
edition = "2021"
description = "Self-hosted AI dev workflow control plane"
license = "AGPL-3.0-only"
# Integration tests are modules of one binary (tests/it.rs): one link of the
# library instead of one per file.
autotests = false

[lib]
name = "kronn"
path = "src/lib.rs"

[[bin]]
name = "kronn"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it.rs"

[features]
# `full-tests` (default) compiles every unit-test module. The macOS portability
# job turns it off (`--no-default-features`) and compiles only the four suites
# it runs: the full lib-test binary (9 200 tests) needs more memory than the
# 7 GB GitHub macOS runner has and spends its time swapping.
default = ["full-tests"]
full-tests = []

[workspace]
members = [".", "crates/*"]
# A bare `cargo clippy` or `cargo test` covers every crate, not the top one alone.
default-members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.15.2"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
kronn-l0 = { path = "crates/l0", default-features = false }
kronn-l1 = { path = "crates/l1", default-features = false }
kronn-l2 = { path = "crates/l2", default-features = false }
kronn-l3 = { path = "crates/l3", default-features = false }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
csv = { workspace = true }
rusqlite = { workspace = true }
cron = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
walkdir = { workspace = true }
open = { workspace = true }
which = { workspace = true }
libc = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
keyring = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
fs2 = { workspace = true }
reqwest = { workspace = true }
serde_json_path = { workspace = true }
governor = { workspace = true }
secrecy = { workspace = true }
tokio-tungstenite = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
regex-lite = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
inventory = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
calamine = { workspace = true }
zip = { workspace = true }
pdf-extract = { workspace = true }
ts-rs = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
html5ever = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
errno = { workspace = true }

[dev-dependencies]
kronn-l0 = { path = "crates/l0", default-features = false, features = ["test-support"] }
kronn-l1 = { path = "crates/l1", default-features = false, features = ["test-support"] }
kronn-l2 = { path = "crates/l2", default-features = false, features = ["test-support"] }
kronn-l3 = { path = "crates/l3", default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
http-body-util = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures = { workspace = true }
wiremock = { workspace = true }
walkdir = { workspace = true }
proptest = { workspace = true }

[workspace.dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "sync", "time", "io-util", "signal"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "1"
# A strict YAML parser: it proves the front matter Kronn writes is valid YAML
# (KT-1309, tests) and reads the pnpm lock a dependency fetch validates (KT-1649).
serde_yaml = "0.9"
csv = "1"

# Database (embedded)
rusqlite = { version = "0.41", features = ["bundled", "backup", "trace", "hooks"] }

# Scheduling
cron = "0.16"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# Machine timezone (macOS/Windows/Linux); already in the tree through chrono.
iana-time-zone = "0.1"

# File system
walkdir = "2"
open = "5"              # Open URLs in system browser

# Process management
which = "8"           # Find executables in PATH
libc = "0.2"          # Unix process control (setpgid, kill -pgid)

# Async streams
futures = "0.3"
async-stream = "0.3"

# Crypto
aes-gcm = "0.10"
sha2 = "0.11"
# RFC 6238 TOTP (the strong confirmation that raises a trust level, KT-1492): HMAC-SHA1.
sha1 = "0.10"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# OS keychain (macOS Keychain / Windows Credential Manager) — a backup tier for
# the encryption key. DELIBERATELY no Linux Secret Service feature: it pulls
# `libdbus-sys`, a C system dependency (libdbus-1-dev) that broke CI/Docker
# builds — for a tier that can't work there anyway (no D-Bus daemon in
# containers/WSL, debug builds skip the keychain). On Linux, `Entry::new`
# errors → the keyvault probe degrades to the 0600 sidecar, which was already
# the primary Linux tier in the design matrix.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Recovery passphrase → KEK (Argon2id) that wraps the encryption key, so it's
# recoverable even after total loss of the machine + keychain + sidecar.
argon2 = "0.5"
zeroize = "1"           # Wipe derived KEKs / key material from memory after use
# Advisory exclusive lock on the data dir — exactly one backend per config_dir()
# (prevents two instances racing on config.toml / the key / the DB).
fs2 = "0.4"

# HTTP client (for tracker APIs)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form", "multipart"] }

# ApiCall step (désagentification) — JSONPath extraction, rate limiting, retry, secret redaction
serde_json_path = "0.7"   # RFC 9535 JSONPath, runs on serde_json::Value directly
governor = "0.10"         # Token-bucket rate limiter, per-(plugin,config) keys
secrecy = "0.10"          # Wrap decrypted env so it's never Debug-logged

# WebSocket client (for peer-to-peer connections between Kronn instances)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
regex-lite = "0.1"
thiserror = "2"
anyhow = "1"
# Link-time registry: a lower crate calls into a higher one (core::uplink).
inventory = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"     # XDG paths
# Parse a proposed Rust edit before any durable write. `span-locations` makes
# the refusal actionable for a bounded local-model repair.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Document extraction (context files: xlsx, docx, pptx, pdf)
calamine = "0.38"                                          # Excel spreadsheets
zip = { version = "9", default-features = false, features = ["deflate"] }  # Office XML (docx, pptx)
pdf-extract = "0.12"                                        # PDF text extraction (0.12 → lopdf ≥0.42, fixes RUSTSEC-2026-0187)

# TypeScript type generation
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }

# OpenAPI / Swagger UI — hand-curated spec (utoipa::OpenApi derive) +
# embedded Swagger UI served at /api/docs. utoipa-swagger-ui ships an
# axum integration we use directly; we don't run an external swagger
# binary in production.
utoipa = { version = "6", features = ["chrono", "uuid", "axum_extras"] }
# `vendored` ships the Swagger UI assets inside the crate so the build
# doesn't need network or `curl` at compile time. Without it, the
# build script tries to fetch the SWAGGER_UI_DOWNLOAD_URL via curl,
# which fails inside slim Docker builders that don't ship curl.
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
html5ever = "0.40.1"

# rooted_io reads a file's link count through its handle on Windows.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
errno = "0.3"   # errno on every unix target, to tell a readdir error from the end
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serial_test = "3"
tempfile = "3"
wiremock = "0.6"
proptest = "1"

[profile.dev]
# Compile deps with optimizations, keep local code in debug mode
# Dramatically speeds up runtime AND reduces dep recompilation on code changes
opt-level = 0
# Keep source locations for actionable local failures without retaining full
# debug information in every object file.  The explicit safety settings below
# preserve Cargo's debug defaults while preventing incremental object graphs
# from accumulating across short-lived qualification worktrees.
debug = "line-tables-only"
incremental = false
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Fast release build for local dev — `cargo build --profile fast`
# Same optimizations but skips LTO and uses more codegen units (4x faster)
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

