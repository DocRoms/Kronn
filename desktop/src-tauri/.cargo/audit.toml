# cargo-audit configuration for the desktop crate — see https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# Do not add an ignore without a dated rationale and review deadline. CI runs
# `cargo audit` here (see `.github/workflows/ci-test.yml`, job `security-scan`,
# and `.github/workflows/dependency-review.yml`). The backend has its own
# config in `backend/.cargo/audit.toml`; the desktop crate depends on the
# backend crate, so both lock files share most of the same transitive paths.
[advisories]
# 2026-11-10 — RUSTSEC-2026-0367/0368/0369/0429 (all patched in zip >= 9.0.0:
# SUID/SGID bits kept, symlinks and permissions escaping the destination, abort on
# a symlink entry with a large declared size; 0368/0369/0429 are on
# `ZipArchive::extract`). The only zip < 9 in this lock file is zip 3.0.0, a
# build-dependency of utoipa-swagger-ui 9.0.2 (`cargo tree -i zip@3.0.0`:
# zip 3.0.0 <- utoipa-swagger-ui 9.0.2 <- kronn (backend) <- kronn-desktop).
# Why no upgrade: utoipa-swagger-ui 9.0.2 requires `zip = "^3.0"`, so
# `cargo update -p zip` cannot leave 3.x. The release lines that move off it need a
# major bump of the backend's `utoipa` 5 -> 6: utoipa-swagger-ui 10.0.0/10.0.1
# require utoipa ^6 and zip ^8.6 (still vulnerable), only 10.0.2 requires zip ^9.0
# (crates.io index). That change belongs to the backend crate (backend/Cargo.toml,
# backend/src/lib.rs, backend/src/api/openapi.rs, backend/src/api/version.rs) and
# is out of scope for this desktop audit task.
# Exploitability: none reachable at runtime. The code is in the build script of
# utoipa-swagger-ui, not in the shipped binary. With the `vendored` feature it opens
# the Swagger UI archive embedded in the utoipa-swagger-ui-vendored crate (a
# checksum-pinned crates.io dependency), never a user-supplied or downloaded archive.
# It does not call `ZipArchive::extract` (0368/0369/0429); it walks `by_index` and
# writes the `dist/` entries itself, and applies each entry's unix mode (the
# 0367 class) to files under its own build output directory.
# Follow-up: KT-1647 — upgrade utoipa to 6 and utoipa-swagger-ui to >= 10.0.2 in the
# backend, which removes zip 3.0.0 from both lock files.
# Review by 2026-11-16, or as soon as utoipa-swagger-ui is upgraded.
#
# RUSTSEC-2026-0459 (libsqlite3-sys) is deliberately NOT ignored: the rusqlite bump
# to 0.41.1 / libsqlite3-sys 0.39.1 lands with KT-1620 (PR #507), which also updates
# this lock file.
ignore = ["RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369", "RUSTSEC-2026-0429"]
