# cargo-audit configuration for the desktop crate — see https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# Do not add an ignore without a dated rationale and review deadline. CI runs
# `cargo audit` here (see `.github/workflows/ci-test.yml`, job `security-scan`,
# and `.github/workflows/dependency-review.yml`). The backend has its own
# config in `backend/.cargo/audit.toml`; the desktop crate depends on the
# backend crate, so both lock files share most of the same transitive paths.
[advisories]
# 2026-11-10 — RUSTSEC-2026-0367/0368/0369/0429 (zip < 9: SUID/SGID bits kept,
# symlinks and permissions escaping the destination, abort on a symlink entry with
# a large declared size, all on `ZipArchive::extract` to disk). The only zip < 9 in
# this lock file is zip 3.0.0, a build dependency of utoipa-swagger-ui 9.0.2 (via
# the backend crate): it unpacks its own bundled Swagger UI archive at build time,
# never user input (`cargo tree -i zip@3.0.0`). Same path and same blocker as the
# backend ignore: utoipa-swagger-ui 10 needs utoipa 6 (major bump, tracked
# separately). Review by 2026-11-16, or as soon as utoipa-swagger-ui is upgraded.
# 2026-11-10 — RUSTSEC-2026-0459 (libsqlite3-sys < 0.39 bundles a vulnerable C
# SQLite, CVE-2026-119375). libsqlite3-sys 0.37.0 comes from rusqlite 0.39.0, a
# direct dependency of the backend crate that the desktop app embeds; the fix needs
# the rusqlite bump (libsqlite3-sys >= 0.39.0), which changes the backend lock file
# and is out of scope for this desktop audit task. The backend lock file reports
# the same advisory. Review by 2026-11-16, or as soon as rusqlite is upgraded.
ignore = ["RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369", "RUSTSEC-2026-0429", "RUSTSEC-2026-0459"]
