<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 464"
     role="img" aria-labelledby="shadow-title shadow-desc"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- One step and its shadows: per-step comparison and optional merge. Own dark backdrop, so it reads the
       same on a light or a dark GitHub theme. -->
  <title id="shadow-title">Step shadows: re-run one step beside the main execution, compare, optionally merge</title>
  <desc id="shadow-desc">
    One step receives its input. The main execution is the step as it is, and only its output continues the workflow. Beside it, 0 to N shadows re-run only that step on exactly the same input: an identical shadow tests how deterministic the agent is, a varied one changes the agent, the model, the prompt or the skills, at one level or at all. A shadow never runs a step that acts outside Kronn, nor a Gate. For each step, the comparison shows a header with what differs, the tokens, cost and duration, an output diff and a determinism summary, and a version a shadow tested can be promoted in one click. An optional merge, off by default, condenses the main execution with one, several or all of its shadows: each point is verified and its provenance kept, and the merged result becomes the step output. Without a merge, or if a point cannot be verified, the main output stays the step output.
  </desc>

  <rect x="0" y="0" width="1200" height="464" fill="#0d1117"/>

  <style>
    .title  { font-size: 22px; font-weight: 700; fill: #f9fafb; }
    .label  { font-size: 15px; font-weight: 700; fill: #f9fafb; }
    .small  { font-size: 12px; fill: #d1d5db; }
    .tiny   { font-size: 11px; fill: #9ca3af; font-style: italic; }
    .kind   { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .loop   { font-size: 11px; font-weight: 600; fill: #f87171; }
    .chip   { font-size: 12px; font-weight: 600; fill: #f9fafb; }
  </style>

  <text x="600" y="36" text-anchor="middle" class="title">Step shadows: compare them, merge them if you want</text>

  <g role="group" aria-label="One step: same input">
    <rect x="30" y="170" width="170" height="108" rx="10" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="46" y="191" class="kind" fill="#38bdf8">One step</text>
    <text x="46" y="214" class="label">Same input</text>
    <text x="46" y="235" class="small">prompt context,</text>
    <text x="46" y="252" class="small">previous outputs,</text>
    <text x="46" y="269" class="small">variables</text>
  </g>
  <g role="group" aria-label="Main execution, published">
    <rect x="240" y="66" width="270" height="96" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5"/>
    <text x="256" y="87" class="kind" fill="#34d399">Published</text>
    <text x="256" y="110" class="label">Main execution</text>
    <text x="256" y="131" class="small">the step as it is;</text>
    <text x="256" y="148" class="small">its output continues the workflow</text>
  </g>
  <g role="group" aria-label="Identical shadow, no side effects">
    <rect x="240" y="176" width="270" height="96" rx="10" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="256" y="197" class="kind" fill="#a78bfa">No side effects</text>
    <text x="256" y="220" class="label">Shadow · identical</text>
    <text x="256" y="241" class="small">same agent, same input:</text>
    <text x="256" y="258" class="small">how deterministic is it?</text>
  </g>
  <g role="group" aria-label="Varied shadow, no side effects">
    <rect x="240" y="286" width="270" height="96" rx="10" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="256" y="307" class="kind" fill="#a78bfa">No side effects</text>
    <text x="256" y="330" class="label">Shadow · varied</text>
    <text x="256" y="351" class="small">other agent, model, prompt or</text>
    <text x="256" y="368" class="small">skills: one level, or all</text>
  </g>
  <g role="group" aria-label="Per-step comparison">
    <rect x="560" y="66" width="290" height="140" rx="10" fill="#f9fafb" fill-opacity="0.06" stroke="#f9fafb" stroke-width="1.5"/>
    <text x="576" y="110" class="label">Comparison per step</text>
    <text x="576" y="131" class="small">a header: what differs</text>
    <text x="576" y="148" class="small">tokens · cost · duration</text>
    <text x="576" y="165" class="small">output diff, line by line</text>
    <text x="576" y="182" class="small">determinism summary</text>
  </g>
  <g role="group" aria-label="Optional merge">
    <rect x="560" y="244" width="290" height="140" rx="10" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="576" y="265" class="kind" fill="#fbbf24">Optional · off by default</text>
    <text x="576" y="288" class="label">Merge</text>
    <text x="576" y="309" class="small">main + one, several or all</text>
    <text x="576" y="326" class="small">shadows; a condense pass dedups,</text>
    <text x="576" y="343" class="small">verifies each point and keeps</text>
    <text x="576" y="360" class="small">its provenance</text>
  </g>
  <g role="group" aria-label="Promote the tested version in one click">
    <rect x="890" y="66" width="280" height="140" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5"/>
    <text x="906" y="87" class="kind" fill="#34d399">One click</text>
    <text x="906" y="110" class="label">Promote</text>
    <text x="906" y="131" class="small">the version a shadow tested,</text>
    <text x="906" y="148" class="small">pinned on the step</text>
  </g>
  <g role="group" aria-label="Step output">
    <rect x="890" y="244" width="280" height="140" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.5"/>
    <text x="906" y="265" class="kind" fill="#34d399">Result</text>
    <text x="906" y="288" class="label">Output of the step</text>
    <text x="906" y="309" class="small">the merged result, if you merge;</text>
    <text x="906" y="326" class="small">otherwise the main output</text>
    <text x="906" y="343" class="small">(also if a point can't be verified)</text>
  </g>
  <text x="240" y="406" class="tiny">✕ never on a step acting outside Kronn, nor on a Gate · 0 to N shadows per step</text>
  <g aria-hidden="true">
    <path d="M 200 224 C 220 224 220 114 234 114" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="240,114 231,110 231,118" fill="#d1d5db"/>
    <path d="M 200 224 L 234 224" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="240,224 231,220 231,228" fill="#d1d5db"/>
    <path d="M 200 224 C 220 224 220 334 234 334" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="240,334 231,330 231,338" fill="#d1d5db"/>
    <path d="M 510 114 L 530 114 M 510 224 L 530 224 M 510 334 L 530 334 M 530 114 L 530 334" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <circle cx="530" cy="136" r="3.5" fill="#d1d5db"/>
    <circle cx="530" cy="314" r="3.5" fill="#fbbf24"/>
    <path d="M 530 136 L 554 136" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="560,136 551,132 551,140" fill="#d1d5db"/>
    <path d="M 530 314 L 554 314" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
    <polygon points="560,314 551,310 551,318" fill="#fbbf24"/>
    <path d="M 850 136 L 884 136" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="890,136 881,132 881,140" fill="#d1d5db"/>
    <path d="M 850 314 L 884 314" stroke="#d1d5db" stroke-width="2" fill="none"/>
    <polygon points="890,314 881,310 881,318" fill="#d1d5db"/>
  </g>

  <text x="600" y="442" text-anchor="middle" class="small">
    Re-run one step on real data, as it is or with another agent, model, prompt or skills, without publishing or breaking anything.
  </text>
</svg>
