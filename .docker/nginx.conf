# Rate limiting zone — generous for local dev, prevents accidental DDoS
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Access log without the query string: the WebSocket upgrade carries the
# operator token as `?token=` (KT-1033).
log_format kronn_no_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status '
                          '$body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log kronn_no_query;

    # Default request body cap. nginx's own default (1 MiB) would 413 uploads
    # before they reach the backend. Every axum `DefaultBodyLimit` in
    # backend/src/lib.rs must fit under the cap of its nginx location:
    # 64 MiB here, larger only in the import locations below.
    # backend/scripts/ci/nginx_body_limits.py checks this in CI.
    client_max_body_size 64m;

    # Gzip compression — reduces JS/CSS/JSON size by ~60%
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # frame-src of the app document: 'self' everywhere, plus the allowed embed
    # sites on the documents served by `location /` (read from the backend).
    set $kronn_frame_src "'self'";

    # Security headers. A location that adds its own header drops all of these,
    # so locations never use add_header.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://huggingface.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob:; media-src 'self' blob:; font-src 'self' data:; frame-src $kronn_frame_src;" always;

    # SSE/long-lived API routes — no rate limiting (these are streaming connections)
    location ~ ^/api/discussions/[^/]+/(messages|run|orchestrate)$ {
        proxy_pass http://backend:3140;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;  # 30 min for long-running SSE (AI orchestration)
    }

    location ~ ^/api/projects/[^/]+/ai-audit$ {
        proxy_pass http://backend:3140;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
    }

    # Full-instance and discussion imports: the backend accepts 512 MiB
    # there. Streaming the body (no request buffering) avoids a 512 MiB temp
    # file in the gateway, and the longer timeouts cover a slow upload.
    location = /api/config/import {
        limit_req zone=api burst=50 nodelay;
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_request_buffering off;

        proxy_pass http://backend:3140;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location = /api/discussions/import {
        limit_req zone=api burst=50 nodelay;
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_request_buffering off;

        proxy_pass http://backend:3140;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # API routes → backend (rate limited)
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend:3140;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;  # 30 min for long-running SSE (AI audit, orchestration)
    }

    # WebSocket → backend (peer-to-peer sync + frontend real-time)
    location /api/ws {
        proxy_pass http://backend:3140;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;  # 24h keep-alive for persistent WS
    }

    # Hashed, immutable assets → frontend, without the frame-src lookup
    location /assets/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Everything else (the app document) → frontend, with the allowed embed
    # sites in frame-src. Validators are dropped so a reload always carries the
    # current list, never a 304 for a stale one.
    location / {
        auth_request /_kronn/frame-src;
        auth_request_set $kronn_frame_src $upstream_http_x_kronn_frame_src;
        # Backend unreachable: serve the document with frame-src 'self'.
        error_page 500 = @frontend_self_frames;

        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Content-Security-Policy;
    }

    location @frontend_self_frames {
        set $kronn_frame_src "'self'";
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Content-Security-Policy;
    }

    location = /_kronn/frame-src {
        internal;
        proxy_pass http://backend:3140/api/embed-origins/frame-src;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # The header holds up to 16 KiB of sources (MAX_FRAME_SRC_BYTES).
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
    }
}
