<style>
 :root{--bg:#0d0f13;--card:#151920;--line:#232833;--dim:#8b93a1;--txt:#e9ecf1;--accent:#4ade80}
 *{box-sizing:border-box}
 body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:38px 40px 56px}
 header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
 h1{font-size:27px;margin:0;letter-spacing:-.02em}
 .rev{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
 .sub{color:var(--dim);font-size:13px;margin:0 0 24px}
 .synth{background:linear-gradient(135deg,#132a1f,#101c19);border:1px solid #23503a;border-radius:14px;padding:18px 22px;margin-bottom:24px;font-size:15.5px;line-height:1.6}
 .grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
 @media(max-width:1000px){.grid{grid-template-columns:1fr}}
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
 .lbl{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:14px}
 .now{display:flex;align-items:baseline;gap:8px}
 .t{font-size:52px;font-weight:650;line-height:.95;letter-spacing:-.03em}
 .u{font-size:19px;color:var(--dim)}
 .meta{color:var(--dim);font-size:12.5px;margin-top:8px}
 .hours{display:flex;gap:6px;margin-top:20px;overflow-x:auto;padding-bottom:4px}
 .h{flex:0 0 46px;text-align:center}
 .h .hh{font-size:10.5px;color:var(--dim);margin-bottom:6px}
 .bar{height:56px;display:flex;align-items:flex-end;justify-content:center}
 .bar i{display:block;width:16px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#4ade80,#1c7a46)}
 .h .tt{font-size:11.5px;margin-top:6px;font-variant-numeric:tabular-nums}
 .h .pp{font-size:9.5px;color:#5c93d6;margin-top:2px;height:12px}
 ul{list-style:none;margin:0;padding:0}
 li{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
 li:last-child{border-bottom:0}
 li img{width:16px;height:16px;border-radius:3px;flex:0 0 16px;margin-top:2px}
 .ti{flex:1;font-size:13.5px;line-height:1.45}
 .src{display:block;color:var(--dim);font-size:11px;margin-top:3px}
 a.cta{flex:0 0 auto;color:var(--accent);text-decoration:none;font-size:12px;border:1px solid #23503a;border-radius:8px;padding:5px 11px;white-space:nowrap}
 a.cta:hover{background:#132a1f}
 .empty{color:#5a6070;font-style:italic}
</style>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/8AD//8AAP/+AAA/+AAAH/AAAA/gAAAHwAAAB8AAAAOAAAABgAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAAGAAAABwAAAA+AAAAPgAAAH8AAAD/gAAB/8AAB//wAA///AA/8="};
 var LABELS = {euronews:'Euronews', lemonde:'Le Monde', guardian:'The Guardian'};
 var WMO = {0:'ciel clair',1:'peu nuageux',2:'partiellement nuageux',3:'couvert',45:'brouillard',48:'brouillard givrant',51:'bruine',61:'pluie faible',63:'pluie',65:'pluie forte',80:'averses',95:'orage'};

 // Kronn defines KronnPageData as a lazy getter on the sandbox window, so it
 // is not there at parse time. Poll briefly, then give up quietly: an empty
 // card is honest, a spinner that never stops is not.
 (function wait(n){
   var K = window.KronnPageData;
   if (K && K.datasets && Object.keys(K.datasets).length) return render(K);
   if (n > 60) return;
   setTimeout(function(){ wait(n+1); }, 50);
 })(0);

 function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }); }

 function render(K){
   var D = K.datasets || {}, page = K.page || {};
   function cur(n){ return D[n] && D[n].current; }

   document.getElementById('rev').textContent = 'données r' + (page.data_revision == null ? '?' : page.data_revision);
   document.getElementById('stamp').textContent = 'Publié par un workflow Kronn — météo Open-Meteo, dépêches Euronews, Le Monde et The Guardian.';

   // A local model sometimes answers twice — two complete sentences glued
   // together. Keeping the first is the honest render: the page shows what was
   // asked for, one sentence, without pretending the second does not exist in
   // the dataset.
   var s = cur('synthese');
   if (s) {
     var text = typeof s === 'string' ? s.trim() : JSON.stringify(s);
     var cut = text.indexOf('.', 40);
     if (cut > -1 && cut < text.length - 1) text = text.slice(0, cut + 1);
     document.getElementById('synth').textContent = text;
   }

   var m = cur('meteo');
   if (m && m.current) {
     var c = m.current;
     document.getElementById('now').innerHTML =
       '<div class="now"><span class="t">' + c.temperature_2m + '</span><span class="u">°C</span></div>' +
       '<div class="meta">' + (WMO[c.weather_code] || 'conditions ' + c.weather_code) +
       ' · vent ' + c.wind_speed_10m + ' km/h · relevé ' + String(c.time).slice(11) + '</div>';

     var h = m.hourly || {};
     var times = h.time || [], temps = h.temperature_2m || [], rain = h.precipitation_probability || [];
     if (times.length) {
       var slice = times.slice(0, 10), tt = temps.slice(0, 10);
       var lo = Math.min.apply(null, tt), hi = Math.max.apply(null, tt), span = (hi - lo) || 1;
       document.getElementById('hours').innerHTML = slice.map(function(ts, i){
         var pct = 18 + Math.round(((tt[i] - lo) / span) * 38);
         var p = rain[i];
         return '<div class="h">' +
           '<div class="hh">' + String(ts).slice(11, 16) + '</div>' +
           '<div class="bar"><i style="height:' + pct + 'px"></i></div>' +
           '<div class="tt">' + Math.round(tt[i]) + '°</div>' +
           '<div class="pp">' + (p > 0 ? p + '%' : '') + '</div></div>';
       }).join('');
     }
   }

   // Three datasets, one list: each publisher keeps its own dataset, and the
   // page is what interleaves them and stamps each line with where it came
   // from. Sorted newest first, so the mix reads as one feed rather than
   // three blocks stacked.
   var a = [];
   ['euronews','lemonde','guardian'].forEach(function(src){
     var items = cur(src);
     if (Array.isArray(items)) items.slice(0, 5).forEach(function(x){
       a.push({ title: x.title, link: x.link, pubDate: x.pubDate, source: src });
     });
   });
   a.sort(function(x, y){ return String(y.pubDate || '').localeCompare(String(x.pubDate || '')); });
   if (a.length) {
     document.getElementById('news').innerHTML = a.slice(0, 15).map(function(x){
       var src = x.source || 'euronews';
       return '<li>' +
         '<img src="' + (ICONS[src] || '') + '" alt="" />' +
         '<span class="ti">' + esc(x.title) +
           '<span class="src">' + esc(LABELS[src] || src) + (x.pubDate ? ' · ' + esc(String(x.pubDate).slice(0, 16)) : '') + '</span>' +
         '</span>' +
         (x.link ? '<a class="cta" href="' + esc(x.link) + '" target="_blank" rel="noopener">Voir l\'article →</a>' : '') +
       '</li>';
     }).join('');
   }
 }
