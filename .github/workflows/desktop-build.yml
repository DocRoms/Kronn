name: Desktop Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-review:
    name: Pre-release dependency review
    uses: ./.github/workflows/dependency-review.yml

  build-desktop:
    needs: dependency-review
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - os: macos-15
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}
    env:
      # Makes Tauri's DMG bundler use its headless path instead of asking
      # Finder/AppleScript to arrange the image on CI runners.
      CI: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # checkout@v7 retries Git fetch three times. The step timeout keeps
      # hosted-runner DNS failures bounded and visibly separate from packaging.
      - name: Checkout source (bounded network retry)
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # Tauri 2 requires webkit2gtk-4.1 (vs Tauri 1 / webkit2gtk-4.0).
          # Ubuntu 22.04 ships 4.1 in the universe repository (enabled by
          # default on desktop installs). We also pull libsoup-3.0-dev and
          # libjavascriptcoregtk-4.1-dev explicitly: webkit2gtk-4.1 transitively
          # depends on them but on minimal images (CI containers, server
          # installs) the dev headers are not always pulled in automatically.
          # patchelf is required by tauri-bundler to fix RPATHs in the AppImage.
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpango1.0-dev \
            libharfbuzz-dev \
            libffi-dev \
            patchelf \
            file

      - name: Install macOS document-rendering libraries
        if: startsWith(matrix.os, 'macos')
        run: brew install pango libffi

      - name: Install Windows document-rendering libraries
        if: matrix.os == 'windows-latest'
        id: msys2
        uses: msys2/setup-msys2@v2.32.0
        with:
          update: false
          # Python.org/Visual Studio builds use UCRT. MSYS2 recommends UCRT64
          # for new software and deprecated MINGW64 in 2026; mixing the old
          # MSVCRT DLL set with CPython made libgobject fail with Win32 0x7e.
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-pango

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          # Cache registries only. `target/` also contains the document-sidecar
          # venv and PyInstaller work tree, which are native to one Python and
          # one Pango/MSYS2 runtime and must never be restored as Cargo data.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python for bundled document exporter
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/sidecars/docs/pyproject.toml

      - name: Enable corepack (provides pnpm pinned by package.json)
        # See `ci-test.yml`. Corepack reads `packageManager` from
        # `frontend/package.json` (pnpm@11.21.0) — single source of truth
        # for the pnpm version across local dev, CI, and Docker builds.
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      # Fail before the expensive Rust/Tauri compile if WeasyPrint cannot load
      # the host's native Pango DLLs or the frozen executable cannot perform
      # its real health, PDF and DOCX operations. Tauri runs the builder again
      # through beforeBuildCommand; the prepared venv is reused.
      - name: Build frozen document exporter
        id: docs-sidecar
        run: node desktop/scripts/build-docs-sidecar.mjs
        env:
          # setup-msys2 may install below the runner temp directory. Its output
          # is the only supported source of truth; C:\msys64 is not stable.
          KRONN_DOCS_NATIVE_LIB_DIRS: ${{ matrix.os == 'windows-latest' && format('{0}/ucrt64/bin', steps.msys2.outputs.msys2-location) || '' }}

      - name: Smoke-test frozen PDF and DOCX exporter
        id: docs-smoke
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            SIDECAR="desktop/src-tauri/resources/docs-sidecar/kronn-docs/kronn-docs.exe"
          else
            SIDECAR="desktop/src-tauri/resources/docs-sidecar/kronn-docs/kronn-docs"
          fi
          python backend/sidecars/docs/smoke_bundle.py \
            "$SIDECAR" \
            --diagnostics target/docs-sidecar-smoke.log

      - name: Upload document-exporter diagnostics on failure
        if: always() && (steps.docs-sidecar.outcome == 'failure' || steps.docs-smoke.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: kronn-docs-diagnostics-${{ matrix.label }}
          path: |
            target/docs-sidecar-bootstrap.log
            target/docs-sidecar-pyinstaller/*.spec
            target/docs-sidecar-pyinstaller/work/warn-*.txt
            target/docs-sidecar-pyinstaller/work/xref-*.html
            target/docs-sidecar-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Clean old bundle artifacts from cargo cache to avoid uploading stale installers
      - name: Clean old bundles
        shell: bash
        run: |
          rm -rf "target/${{ matrix.target }}/release/bundle"
          rm -rf "target/release/bundle"
          rm -rf "desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          rm -rf "desktop/src-tauri/target/release/bundle"

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          # Only export Apple signing env vars if actually configured (non-empty).
          # When secrets are unset, GitHub passes empty strings — Tauri interprets an
          # empty APPLE_CERTIFICATE as "try to sign" and fails on certificate import.
          if [ -n "$_APPLE_CERTIFICATE" ]; then
            export APPLE_CERTIFICATE="$_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$_APPLE_CERTIFICATE_PASSWORD"
          fi
          if [ -n "$_APPLE_SIGNING_IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY="$_APPLE_SIGNING_IDENTITY"
          fi
          if [ -n "$_APPLE_ID" ] && [ -n "$_APPLE_PASSWORD" ] && [ -n "$_APPLE_TEAM_ID" ]; then
            export APPLE_ID="$_APPLE_ID"
            export APPLE_PASSWORD="$_APPLE_PASSWORD"
            export APPLE_TEAM_ID="$_APPLE_TEAM_ID"
          fi
          cargo tauri build --target ${{ matrix.target }}
        env:
          KRONN_DOCS_NATIVE_LIB_DIRS: ${{ matrix.os == 'windows-latest' && format('{0}/ucrt64/bin', steps.msys2.outputs.msys2-location) || '' }}
          # Tauri updater signing — safe to pass even if empty (Tauri ignores empty values)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing — stored in prefixed vars, only exported when non-empty (see script above)
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Tauri signs the .app BEFORE creating the DMG. `bundle.macOS.signingIdentity`
      # defaults to the ad-hoc identity and APPLE_SIGNING_IDENTITY overrides it
      # when release credentials are configured. Signing a bundle copy after the
      # DMG was created leaves the uploaded image with an invalid linker signature.
      - name: Verify macOS disk image and app signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          BUNDLE_CANDIDATES=(
            "desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
            "desktop/src-tauri/target/release/bundle"
            "target/${{ matrix.target }}/release/bundle"
            "target/release/bundle"
          )
          BUNDLE_DIR=""
          for c in "${BUNDLE_CANDIDATES[@]}"; do
            if [ -d "$c" ]; then
              echo "Bundle dir found at $c"
              BUNDLE_DIR="$c"
              break
            fi
          done
          if [ -z "$BUNDLE_DIR" ]; then
            echo "No bundle dir found in any of:"
            printf '  - %s\n' "${BUNDLE_CANDIDATES[@]}"
            exit 1
          fi
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name "*.dmg" -print -quit)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found under $BUNDLE_DIR/dmg"
            exit 1
          fi
          hdiutil verify "$DMG_PATH"
          MOUNT_DIR=$(mktemp -d)
          trap 'hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true; rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" "$DMG_PATH"
          APP_PATH=$(find "$MOUNT_DIR" -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "The DMG contains no .app bundle"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --display --verbose=2 "$APP_PATH"
          if [ -n "$_APPLE_ID" ] && [ -n "$_APPLE_PASSWORD" ] && [ -n "$_APPLE_TEAM_ID" ]; then
            xcrun stapler validate "$DMG_PATH"
            spctl --assess --type execute --verbose=4 "$APP_PATH"
          else
            echo "Ad-hoc build verified; Gatekeeper still requires explicit user approval."
          fi
        env:
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ─── Upload artifacts ─────────────────────────────────────────

      # Path resolution note (2026-05-18 fix): since `.cargo/config.toml`
      # sets `target-dir = "target"` at the repo root, builds now land in
      # `/target/...` instead of `/desktop/src-tauri/target/...`. The
      # globs below carry BOTH roots so the workflow works whether the
      # build was emitted under the legacy or shared target dir.
      # `upload-artifact` silently skips missing paths so listing both
      # is safe. Cf. [[feedback_rust_target_bloat]].

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: kronn-windows
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: kronn-${{ matrix.label }}
          # Four candidate paths: legacy vs shared target root × prefixed
          # triple vs unprefixed (Tauri uses the unprefixed `release/bundle`
          # when --target is the host-default triple, e.g. macos-15 /
          # x86_64-apple-darwin cross-compile on arm64 host).
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: kronn-linux
          path: |
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ─── Prove that every matrix leg produced an installer ─────────────

  verify-installers:
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verifier
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify the complete installer matrix
        run: python backend/sidecars/docs/verify_artifacts.py artifacts

  # ─── Create GitHub Release on tag ─────────────────────────────────

  release:
    needs: [build-desktop, verify-installers]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List verified artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## Installation

            | OS | File | Min version |
            |----|------|-------------|
            | Windows | `.exe` (NSIS) or `.msi` | Windows 10+ |
            | macOS Apple Silicon | `aarch64.dmg` | macOS 11+ |
            | macOS Intel | `x64.dmg` | macOS 11+ |
            | Linux | `.deb` or `.AppImage` | Ubuntu 22.04+ / Debian 12+ / Fedora 38+ |

            ### Linux — webkit2gtk-4.1 requirement

            Kronn uses Tauri 2 which requires **`libwebkit2gtk-4.1-0`** at runtime.
            On Ubuntu 22.04 it lives in the `universe` repository (enabled by
            default on desktop installs). On minimal/server installs you may need:
            ```bash
            sudo add-apt-repository universe
            sudo apt update
            sudo apt install -y libwebkit2gtk-4.1-0
            sudo dpkg -i kronn_*.deb
            sudo apt-get -f install   # resolves any remaining deps
            ```
            On older distros (Ubuntu 20.04, RHEL 8) the `.deb` will not install —
            use the AppImage instead, or upgrade.

            ### macOS — "app is damaged" warning

            Kronn is open-source and not signed with an Apple Developer certificate.
            macOS Gatekeeper may show _"Kronn is damaged and can't be opened"_.

            **Fix** — run this once after installing:
            ```bash
            xattr -cr /Applications/Kronn.app
            ```
            Then open the app normally.

          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
