name: CI Build

# The app builds: the release backend, platform portability tests, the
# desktop crate and the Windows document exporter. Slower than the `ci-test` loop and only needed
# once a pull request is ready, so they hang off their own label, `ci-build`,
# and `ci-build-gates` is required to merge. Label and edit events never start
# this workflow: its skipped jobs would hide the real results. CI Verdict
# (ci-verdict.yml) answers them, re-running this run once when the label
# arrived after it.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to test (empty: the selected ref)"
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # onnxruntime-node's postinstall downloads CUDA binaries CI never uses, from
  # a host that times out on GitHub runners (see ci-test.yml).
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # Labels are read live: a re-run replays the original event payload.
  require-ci-build-label:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.label.outputs.run }}
    steps:
      # Sparse: the script is all this job needs.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Require ci-build label for pull requests
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          scripts/ci/require_label.sh ci-build "Add the ci-build label before merging: it runs the app builds ci-build-gates requires."
          echo "run=true" >> "$GITHUB_OUTPUT"

  test-desktop-compile:
    needs: require-ci-build-label
    if: needs.require-ci-build-label.outputs.run == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux deps for desktop compile check
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf file
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend (produces frontend/dist/)
        working-directory: frontend
        run: pnpm build
      # Clippy type-checks the crate: a separate check step compiled the
      # backend and the Tauri tree a second time for nothing.
      # desktop/src-tauri/clippy.toml holds the desktop to the spawn rule.
      - name: cargo clippy — desktop crate
        working-directory: desktop/src-tauri
        run: cargo clippy --locked -- -D warnings


  # A Linux unit test cannot prove that CPython can load MSYS2's DLL graph.
  # Exercise the exact Windows release-sidecar path on every tested PR so a
  # broken installer cannot remain hidden until the next version tag.
  test-docs-sidecar-windows:
    needs: require-ci-build-label
    if: needs.require-ci-build-label.outputs.run == 'true' && github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Windows document-rendering libraries
        id: msys2
        uses: msys2/setup-msys2@v2.32.0
        with:
          update: false
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-pango

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/sidecars/docs/pyproject.toml

      - name: Build frozen document exporter
        id: docs-sidecar
        run: node desktop/scripts/build-docs-sidecar.mjs
        env:
          KRONN_DOCS_NATIVE_LIB_DIRS: ${{ format('{0}/ucrt64/bin', steps.msys2.outputs.msys2-location) }}

      - name: Smoke-test frozen PDF and DOCX exports
        id: docs-smoke
        run: >-
          python backend/sidecars/docs/smoke_bundle.py
          desktop/src-tauri/resources/docs-sidecar/kronn-docs/kronn-docs.exe
          --diagnostics target/docs-sidecar-smoke.log

      - name: Upload sidecar diagnostics on failure
        if: always() && (steps.docs-sidecar.outcome == 'failure' || steps.docs-smoke.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: docs-sidecar-windows-diagnostics
          path: |
            target/docs-sidecar-bootstrap.log
            target/docs-sidecar-pyinstaller/*.spec
            target/docs-sidecar-pyinstaller/work/warn-*.txt
            target/docs-sidecar-pyinstaller/work/xref-*.html
            target/docs-sidecar-smoke.log
          if-no-files-found: warn
          retention-days: 7

  # ── KT-373 — portability of the disk-maintenance surface ────────────────────
  #
  # `test-backend` (ci-test.yml) proves this code on Linux only. The guards it contains are
  # path- and filesystem-shaped — symlinks vs. reparse points, permission
  # semantics, free-space reporting — which is exactly the class of behaviour a
  # single OS cannot vouch for. `desktop-build.yml` compiles for all three, but
  # compiling is not executing, and after the 2026-08-21 disk incident this gate
  # is not one to relax.
  #
  # Deliberately NOT the whole backend suite duplicated three times: only the
  # modules whose behaviour actually differs per platform. Linux stays covered by
  # `test-backend`; this adds the two hosts nothing else runs on.
  # A pull request runs the macOS/Windows job only when it changes what that
  # job tests: its compile alone takes an hour. A push to main always runs it.
  portability-scope:
    needs: require-ci-build-label
    if: needs.require-ci-build-label.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.scope.outputs.run }}
      mac: ${{ steps.scope.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Does this change touch what the portability job tests?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mac=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          suites='^backend/src/(core/worktree|core/fs_guard|core/rooted_fd|api/maintenance|db/orchestration|agents/wsl|acp/secret_files|core/config_copies)'
          if echo "$changed" | grep -Eq "$suites|^backend/Cargo\.(toml|lock)\$|^rust-toolchain"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          # The macOS leg swaps on the 7 GB runner (KT-1535): a pull request runs it only
          # when the tested modules change; dependency and toolchain bumps are tested on main.
          if echo "$changed" | grep -Eq "$suites"; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
          else
            echo "mac=false" >> "$GITHUB_OUTPUT"
          fi

  test-backend-portability:
    needs: [require-ci-build-label, portability-scope]
    if: needs.require-ci-build-label.outputs.run == 'true' && needs.portability-scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cold macOS lib-test build outlived 45 min (runs 38620268259, 38595597764);
    # a cancelled job saves no cache, so every later run started cold again.
    # 0.15.1: the macOS compile alone took 73 min with a cache hit (run
    # 39784513201) and Windows finished 17 s under 30 min (PR #238).
    # 0.15.2: twice cancelled at 100 min on a Cargo.lock change (run 41479294845).
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 150 || 45 }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Pull requests only restore (exact key, then the same-OS prefix); the
      # push to main saves, so one shared cache per OS serves every branch
      # instead of one private, never-shared copy per pull request.
      - name: Restore cargo registry and build
        id: cache-portability
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: portability-${{ matrix.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: portability-${{ matrix.os }}-

      # Prints what the measurement below ran on: the preinstalled rustc differs
      # between runner images in rotation, and the standard macOS runner has
      # 7 GB of RAM while the full lib-test binary needs far more.
      - name: Toolchain and machine
        shell: bash
        run: |
          rustc -vV
          cargo -V
          if [ "$RUNNER_OS" = "macOS" ]; then sysctl hw.ncpu hw.memsize; vm_stat | head -5; fi

      # `--no-default-features` drops the `full-tests` feature: only the four
      # suites below are compiled into the lib-test binary. The full binary
      # (9 200 tests) peaks above 13 GB in rustc (13.2 GB measured with -j 3,
      # docs/gotchas/ci-macos-portability-memory.md); the macOS runner has 7 GB
      # and swaps for 45-55 minutes (job 116332790208).
      # A push to main runs every suite on both legs, then saves the shared cache:
      # it is where the macOS leg tests dependency and toolchain bumps (KT-1535).
      - name: macOS suites deferred to main
        if: github.event_name == 'pull_request' && matrix.os == 'macos-latest' && needs.portability-scope.outputs.mac != 'true'
        run: echo "This change does not touch the macOS suites' modules; the push to main runs them."

      - name: Worktree lifecycle and disk guards
        if: matrix.os != 'macos-latest' || github.event_name != 'pull_request' || needs.portability-scope.outputs.mac == 'true'
        run: cargo test --lib --no-default-features core::worktree

      - name: Disk maintenance surface
        if: matrix.os != 'macos-latest' || github.event_name != 'pull_request' || needs.portability-scope.outputs.mac == 'true'
        run: cargo test --lib --no-default-features api::maintenance

      - name: Cleanup authorisation from durable state
        if: matrix.os != 'macos-latest' || github.event_name != 'pull_request' || needs.portability-scope.outputs.mac == 'true'
        run: cargo test --lib --no-default-features db::orchestration

      - name: Windows to WSL agent launches
        if: matrix.os != 'macos-latest' || github.event_name != 'pull_request' || needs.portability-scope.outputs.mac == 'true'
        run: cargo test --lib --no-default-features agents::wsl

      # KT-1595 — the write guards: rooted (directory-fd) writes on macOS, the
      # lstat walk + write by path kept on Windows (residual risk documented in
      # docs/operations/fs-guard-rooted-writes.md). The Windows leg runs the
      # tests of that behaviour; the swap tests are unix-only.
      - name: File write guards (rooted on unix, lstat walk on Windows)
        if: matrix.os != 'macos-latest' || github.event_name != 'pull_request' || needs.portability-scope.outputs.mac == 'true'
        run: cargo test --lib --no-default-features core::fs_guard

      - name: Secret file paths (drives, UNC shares, links)
        if: matrix.os != 'macos-latest' || github.event_name != 'pull_request' || needs.portability-scope.outputs.mac == 'true'
        run: cargo test --lib --no-default-features acp::secret_files

      - name: Sealed config copies (set-aside moves, never replacing)
        if: matrix.os != 'macos-latest' || github.event_name != 'pull_request' || needs.portability-scope.outputs.mac == 'true'
        run: cargo test --lib --no-default-features core::config_copies

      - name: Save cargo registry and build (main)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-portability.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-portability.outputs.cache-primary-key }}

  # The release profile the installers ship (thin LTO, one codegen unit). The
  # ci-test e2e job serves a cheaper build, so this is where every pull request
  # proves the real release build still compiles; tags build the installers.
  build-release:
    needs: require-ci-build-label
    if: needs.require-ci-build-label.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore cargo registry and release dependencies
        id: cache-release
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release/.fingerprint
            target/release/build
            target/release/deps
          key: release-v1-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: release-v1-${{ runner.os }}-
      - name: Build backend (release)
        working-directory: backend
        run: cargo build --release --locked --bin kronn
      - name: Save cargo registry and release dependencies (main)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-release.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release/.fingerprint
            target/release/build
            target/release/deps
          key: ${{ steps.cache-release.outputs.cache-primary-key }}

  ci-build-gates:
    # The one check branch protection requires for this workflow. Red until
    # the pull request carries the `ci-build` label and every build passed.
    if: always()
    needs:
      - require-ci-build-label
      - build-release
      - test-desktop-compile
      - test-docs-sidecar-windows
      - portability-scope
      - test-backend-portability
      - lint-windows-skips
      - boot-scope
      - test-boot-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Only a label check that ran and failed means "label missing". One that
      # was skipped or cancelled (a reopened pull request replacing the run) says
      # nothing about the label: the next step fails on it without blaming it.
      - name: Require the ci-build label
        if: needs.require-ci-build-label.result == 'failure'
        run: |
          echo "::error::Add the ci-build label before merging: it runs the app builds this check requires."
          exit 1
      - name: Fail when the label check did not run
        if: needs.require-ci-build-label.result != 'success' && needs.require-ci-build-label.result != 'failure'
        env:
          LABEL_CHECK: ${{ needs.require-ci-build-label.result }}
        run: |
          echo "::error::The ci-build label check did not run (result: $LABEL_CHECK), so nothing was built. This is not a missing label: re-run this workflow."
          exit 1
      # The name records what this run tested; CI Verdict reads it back.
      - name: "Gate verdict for ${{ github.event_name }} #${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }} base ${{ github.event.pull_request.base.sha }}"
        if: needs.require-ci-build-label.outputs.run == 'true'
        env:
          RESULTS: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        # A push to main only refreshes caches: its skipped checks are by design.
        # The portability job is skipped by design when the change does not
        # touch what it tests (`portability-scope`), and so is the Windows boot
        # job when the change touches nothing Kronn is built or started from (`boot-scope`).
        run: |
          echo "Gate results: $RESULTS"
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" '
            (.["portability-scope"].outputs.run // "true") as $portability
            | (.["boot-scope"].outputs.run // "true") as $boot
            | to_entries
            | all(.[];
                .value.result == "success"
                or ($event == "push" and .value.result == "skipped")
                or (.key == "test-backend-portability" and .value.result == "skipped" and $portability == "false")
                or (.key == "test-boot-windows" and .value.result == "skipped" and $boot == "false"))'

  # ── KT-1629 — a test skipped on Windows is cfg(unix) with a reason ──────────
  #
  # The nightly Windows lib run (ci-nightly-windows.yml) is only worth reading
  # if what it skips is visible and justified. Cheap and Linux-only, so it runs
  # with every build.
  lint-windows-skips:
    needs: require-ci-build-label
    if: needs.require-ci-build-label.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint — a test skipped on Windows is cfg(unix) with a reason
        run: |
          python3 scripts/ci/test_lint_windows_skips.py
          python3 scripts/ci/lint_windows_skips.py

  # ── KT-1629 — Kronn starts on Windows, on every change to the app ───────────
  #
  # #509 / KT-1625 shipped because nothing in CI ever ran Kronn on Windows: the
  # portability job runs a handful of lib modules, and the pre-migration backup
  # (a read-only handle flushed on Windows, os error 5) stopped the boot of an
  # upgraded database, so the desktop showed its startup-error screen.
  #
  # `test-boot-windows` builds the real `kronn.exe` and drives it, with no agent
  # configured (a fresh install, and CI):
  #   1. a fresh data directory: boots, /api/health 200;
  #   2. the previous release's database (backend/tests/fixtures/
  #      db-previous-release.sqlite, migrations pending): backed up, upgraded,
  #      boots, /api/health 200;
  #   3. Playwright opens the UI that binary serves (KRONN_FRONTEND_DIST):
  #      onboarding, then Settings, Projects and Discussions, no 5xx, no error
  #      screen;
  #   4. a project, a sealed secret and a manual backup, read back after a
  #      restart.
  # The specs are frontend/e2e-boot; `pnpm test:boot` runs them locally.
  #
  # Proving the gate: dispatch this workflow with `ref` on this branch's head: it
  # has this job and predates the KT-1625 fix (PR #510, not merged when this was
  # written), so the upgrade case goes red. Green: the same ref once #510 is in.
  boot-scope:
    needs: require-ci-build-label
    if: needs.require-ci-build-label.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Does this change touch the app Kronn boots?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          # What Kronn is built or started from: the backend and its templates, the
          # frontend, the desktop crate that embeds both, the cargo config, the CI
          # scripts this job runs, and this workflow.
          if echo "$changed" | grep -Eq '^(backend|frontend|templates|desktop|scripts/ci)/|^\.cargo/|^\.github/workflows/ci-build\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test-boot-windows:
    needs: [require-ci-build-label, boot-scope]
    if: needs.require-ci-build-label.outputs.run == 'true' && needs.boot-scope.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build the frontend Kronn serves
        working-directory: frontend
        run: pnpm build

      # Same shape as the portability job: pull requests restore, main saves.
      - name: Restore cargo registry and build
        id: cache-boot
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: boot-windows-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: boot-windows-

      - name: Build kronn.exe
        working-directory: backend
        run: cargo build --locked --bin kronn

      - name: Install the Playwright browser
        working-directory: frontend
        shell: bash
        # The CDN is flaky from runners (frontend/e2e/README.md): retry the download.
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install chromium --only-shell && exit 0
            echo "playwright install failed (attempt $attempt)"; sleep 10
          done
          exit 1

      - name: Boot Kronn on a fresh and an upgraded database, and use its UI
        working-directory: frontend
        env:
          KRONN_BIN: ${{ github.workspace }}\target\debug\kronn.exe
          KRONN_FRONTEND_DIST: ${{ github.workspace }}\frontend\dist
          # The state of a fresh install and of CI: fail if the runner has an agent CLI.
          KRONN_E2E_EXPECT_NO_AGENT: "1"
        run: pnpm test:boot

      - name: Upload boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-windows-diagnostics
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Save cargo registry and build (main)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-boot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-boot.outputs.cache-primary-key }}
