name: CI Verdict

# A label change or an edit tests nothing new. CI Tests and CI Build never run
# for them, so their real results stay on the pull request page; this workflow
# republishes only the two required aggregates, from the run that tested the
# same pull request, head and base. When that run predates the label, it is
# re-run once (it reads labels live) and its verdict is repeated.
#
# No job here may carry an `if`: a skipped required check counts as passing.
# The superseding step is the only conditional step besides the label guard.
on:
  pull_request:
    types: [labeled, unlabeled, edited]

permissions: {}

# One verdict per pull-request state: a burst of label events keeps only the
# newest run, so a check that predates the label cannot outlive its successor.
# A push needs no label event to retire the verdict of the old head: the script
# stops waiting once the pull request's head is not the one it was started for.
# A run that finishes then marks every earlier check run of the same gate on the
# same head (earlier verdicts, cancelled ones, the red "no label" run of CI Tests
# or CI Build) as neutral "Superseded by run <id>" (scripts/ci/supersede_verdicts.sh).
concurrency:
  group: ci-verdict-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}
  cancel-in-progress: true

jobs:
  ci-quality-gates:
    runs-on: ubuntu-latest
    # Waits 300 min (previous_gate_verdict.sh) for the tested run's verdict:
    # longer than CI Tests (about 2 h) and CI Build (150 min macOS job plus its
    # gate) can take. If that run is still going, the job keeps polling (pending)
    # until this timeout ends it as cancelled, never red; ci-verdict-rearm.yml
    # re-runs it when the upstream run completes.
    timeout-minutes: 330
    permissions:
      # Re-runs CI Tests when it ran before the label (read-only on forks).
      actions: write
      # Marks this gate's earlier check runs on the same head as superseded.
      checks: write
      contents: read
    steps:
      # First: the superseding step below needs the scripts even when the guard fails.
      - uses: actions/checkout@v4
      - name: Require the ci-test label
        if: "!contains(github.event.pull_request.labels.*.name, 'ci-test')"
        run: |
          echo "::error::Add the ci-test label: it runs the suite this check requires."
          exit 1
      - name: Repeat the CI Tests verdict for this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/previous_gate_verdict.sh ci-test.yml ci-quality-gates ci-test
      # Not on a cancel: a run a newer label event cancelled supersedes nothing.
      - name: Supersede this gate's earlier check runs on the same head
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/supersede_verdicts.sh ci-quality-gates

  ci-build-gates:
    runs-on: ubuntu-latest
    # Same 300 min wait as above: the macOS portability job alone may take 150 min.
    timeout-minutes: 330
    permissions:
      actions: write
      # Marks this gate's earlier check runs on the same head as superseded.
      checks: write
      contents: read
    steps:
      # First: the superseding step below needs the scripts even when the guard fails.
      - uses: actions/checkout@v4
      - name: Require the ci-build label
        if: "!contains(github.event.pull_request.labels.*.name, 'ci-build')"
        run: |
          echo "::error::Add the ci-build label before merging: it runs the app builds this check requires."
          exit 1
      - name: Repeat the CI Build verdict for this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/previous_gate_verdict.sh ci-build.yml ci-build-gates ci-build
      # Not on a cancel: a run a newer label event cancelled supersedes nothing.
      - name: Supersede this gate's earlier check runs on the same head
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/supersede_verdicts.sh ci-build-gates
