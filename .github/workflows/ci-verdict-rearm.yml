name: CI Verdict Re-arm

# A CI Verdict job that waited for a CI Tests / CI Build run longer than its job
# timeout ends cancelled (never red): the upstream run had not failed. A verdict
# that ran on the label event before the upstream run existed, or against an
# earlier attempt of it, ends red for a result that has since changed (KT-1523).
# Nothing would clear either check, so when the upstream run completes this
# re-runs the cancelled or failed gate job; the re-run reads the real result
# (scripts/ci/rearm_verdict.sh).
#
# Security: `workflow_run` runs with a write token whatever the pull request
# is. So this workflow
#   - checks out the DEFAULT branch only (never a pull-request ref), sparse, with
#     no credentials kept, and runs nothing but scripts/ci/rearm_verdict.sh;
#   - reads the upstream run's name and head SHA through `env`, never inside a
#     `run:` script (the SHA is validated by the script);
#   - uses the API only, with `actions: write` (to re-run) and `contents: read`
#     (to check out those scripts), nothing else.
# The pull_request jobs of ci-verdict.yml stay the only ones touching PR code.
on:
  workflow_run:
    workflows: ["CI Tests", "CI Build"]
    types: [completed]

permissions: {}

jobs:
  rearm:
    # Pushes and manual dispatches of the upstream workflows have no verdict.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Re-run the CI Verdict gate that decided before this run completed
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: scripts/ci/rearm_verdict.sh
