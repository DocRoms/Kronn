name: CI Tests

# The fast loop, run on every push of a pull request labelled `ci-test`. The
# app builds (portability, desktop, Windows exporter) live in ci-build.yml
# under their own label. A label event re-runs this workflow only when it
# changes `ci-test` itself; another label's run repeats the earlier verdict.
on:
  pull_request:
    # `opened`/`reopened` exist for the require-ci-label guard below: a fresh
    # PR without the label gets a visible RED check instead of zero runs.
    # `edited` re-runs only when the base branch changed; a title edit, like
    # another workflow's label, repeats the verdict already given.
    types: [opened, reopened, labeled, unlabeled, synchronize, edited]
  push:
    branches: [main]
  # Called by Desktop Build with the release commit: every job then runs, as on
  # a manual dispatch, whatever event started the caller.
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to test"
        required: true
        type: string
      cache_mode:
        description: "Measurement mode (hot reuses the normal cache)"
        required: false
        default: hot
        type: string
      backend_partitions:
        description: "Backend test partitions (empty: repository variable or 2)"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to test (empty: the selected ref)"
        required: false
        default: ""
        type: string
      cache_mode:
        description: "Measurement mode: hot reuses the normal cache; cold uses a run-scoped cargo cache key."
        required: true
        default: hot
        type: choice
        options: [hot, cold]
      backend_partitions:
        description: "Backend test partitions; 1 gives the non-partitioned run that coverage_floors.py compare checks against (empty: repository variable or 2)"
        required: false
        default: ""
        type: string
      sccache:
        description: "Route the instrumented build through sccache (measurement; default: repository variable CI_SCCACHE, else off)"
        required: false
        default: default
        type: choice
        options: [default, "off", "on"]
      cargo_cache_fallback:
        description: "Restore another Cargo.lock's backend cache on a miss (sccache comparator; default: CI_CARGO_CACHE_FALLBACK, else off)"
        required: false
        default: default
        type: choice
        options: [default, "off", "on"]

# Opt every JS-based action (checkout, setup-node, cache, pnpm/action-setup,
# setup-python) into the Node 24 runtime ahead of GitHub's 2026-06-02 forced
# cutover. Silences the "Node.js 20 actions are deprecated" annotations and
# runs on the faster/newer V8. The pinned action versions (@v4/@v5) already
# ship Node 24-compatible entrypoints — this just flips the runtime selector.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # 0.8.11 — onnxruntime-node's postinstall downloads CUDA GPU binaries from
  # api.nuget.org on linux-x64: never used in CI (browser app → onnxruntime-web,
  # CPU binaries bundled in the npm package) and api.nuget.org regularly times
  # out on GitHub runners — THE recurring flake killing Security Scan /
  # build-frontend at `pnpm install`. Documented knob of the package's install
  # script; also set in frontend/Dockerfile + frontend/.npmrc.
  ONNXRUNTIME_NODE_INSTALL: skip
  # Measurement knobs (KT-1118): a manual run's input, else the repository
  # variable, else the default. Pull-request runs read the variables.
  BACKEND_TEST_PARTITIONS: ${{ inputs.backend_partitions || vars.CI_BACKEND_PARTITIONS || '2' }}
  CI_SCCACHE: ${{ inputs.sccache != 'default' && inputs.sccache || vars.CI_SCCACHE || 'off' }}
  CI_CARGO_CACHE_FALLBACK: ${{ inputs.cargo_cache_fallback != 'default' && inputs.cargo_cache_fallback || vars.CI_CARGO_CACHE_FALLBACK || 'off' }}

jobs:
  # Anti green-by-skip: every other job is gated on the `ci-test` label, so an
  # unlabeled PR used to show all-skipped — which satisfies required status
  # checks and reads as green. This required job always runs and fails unless
  # the trigger is a manual measurement or the PR retains the label.
  require-ci-label:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require ci-test label for pull requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_CI_TEST_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-test') }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$HAS_CI_TEST_LABEL" = "true" ]; then
            exit 0
          fi
          echo "::error::This PR has no 'ci-test' label — every CI job was SKIPPED (green-by-skip). Add the label to run the suite."
          exit 1

  # The backend suite runs once, under nextest and coverage, split in three
  # stages: one instrumented build archives every test binary, N partitions
  # run a share of the tests each from that archive, and `test-backend` checks
  # that the partitions form one complete run before enforcing the coverage
  # floors once, on their merged profiles. The 10-minute SLO covers the build
  # start to the aggregate's end, on a verified hot-cache hit.
  build-backend-tests:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      compiled_cache_hit: ${{ steps.verify-backend-cache.outputs.valid }}
      compiled_cache_state: ${{ steps.verify-backend-cache.outputs.state }}
      partitions: ${{ steps.plan.outputs.matrix }}
      partition_count: ${{ steps.plan.outputs.count }}
      rust_toolchain: ${{ steps.toolchain.outputs.version }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Plan the backend partitions
        id: plan
        run: python3 scripts/ci/backend_partitions.py plan --count "$BACKEND_TEST_PARTITIONS" >> "$GITHUB_OUTPUT"

      # Cache the reusable instrumented directories in place. Never archive
      # profraw files, debug/incremental, tmp, or any other transient target
      # subtree: those can be multi-GB and do not make a warm critical-path
      # measurement representative. Caching the exact bounded directories
      # avoids a second full copy during both restore and warmup.
      # CI_CARGO_CACHE_FALLBACK=on restores the newest cache of another
      # Cargo.lock: the comparator sccache must beat. A partial restore reports
      # no cache hit, so it never counts as a hot measurement.
      - name: Cache cargo registry and bounded backend build (hot)
        if: github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'hot'
        id: cache-backend-hot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/llvm-cov-target/debug/.kronn-backend-cache-v3
            target/llvm-cov-target/debug/.fingerprint
            target/llvm-cov-target/debug/build
            target/llvm-cov-target/debug/deps
          key: cargo-hot-v3-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ env.CI_CARGO_CACHE_FALLBACK == 'on' && format('cargo-hot-v3-{0}-', runner.os) || '' }}

      - name: Verify bounded compiled backend cache
        if: github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'hot'
        id: verify-backend-cache
        env:
          ACTION_CACHE_HIT: ${{ steps.cache-backend-hot.outputs.cache-hit }}
        run: |
          state=miss
          valid=false
          if [ "$ACTION_CACHE_HIT" = "true" ]; then
            state=invalid
            if [ -f ../target/llvm-cov-target/debug/.kronn-backend-cache-v3 ] \
              && [ -d ../target/llvm-cov-target/debug/.fingerprint ] \
              && [ -d ../target/llvm-cov-target/debug/build ] \
              && [ -d ../target/llvm-cov-target/debug/deps ] \
              && find ../target/llvm-cov-target/debug/deps -type f -print -quit | grep -q .; then
              state=hit
              valid=true
            fi
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "valid=$valid" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, llvm-tools-preview

      # The aggregate merges the profiles with this exact toolchain's LLVM.
      - name: Record the Rust toolchain
        id: toolchain
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Reject invalid compiled cache hit
        if: steps.verify-backend-cache.outputs.state == 'invalid'
        run: |
          echo '::error::The cache action reported a hit, but no verified compiled backend artifacts were present.'
          exit 1

      # These visible, mutually exclusive steps are durable evidence in the
      # Actions jobs API. The observer uses them to exclude first-run warmups
      # from historical hot-cache statistics.
      - name: Record compiled cache hit
        if: steps.verify-backend-cache.outputs.state == 'hit'
        run: echo 'Compiled backend cache restored for this hot measurement.'

      - name: Record compiled cache warmup miss
        if: steps.verify-backend-cache.outputs.state == 'miss'
        run: echo 'Compiled backend cache was not restored; this run is a warmup and is excluded from hot history.'

      # A cold measurement may populate an isolated Cargo-download cache, but
      # it must never restore compiled artifacts or a broad fallback key.
      - name: Cache cargo registry (cold, isolated)
        if: github.event_name == 'workflow_dispatch' && inputs.cache_mode == 'cold'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-cold-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record cold measurement mode
        if: github.event_name == 'workflow_dispatch' && inputs.cache_mode == 'cold'
        run: "echo 'Cold measurement: compiled backend artifacts are never restored or archived.'"

      # Measured trial (CI_SCCACHE=on), kept only if it shortens a lost-target
      # build without slowing the hot one. cargo-llvm-cov chains a pre-existing
      # RUSTC_WRAPPER, so the instrumentation flags are part of sccache's key.
      - name: Enable sccache (measurement)
        if: env.CI_SCCACHE == 'on'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0

      - name: Route rustc through sccache
        if: env.CI_SCCACHE == 'on'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Same build as `make test-backend-cov`: every lib, binary, example and
      # integration test target, instrumented, then archived for the partitions.
      - name: Build and archive the instrumented tests
        run: cargo llvm-cov nextest-archive --workspace --archive-file ../target/kronn-tests.tar.zst

      # The build compiled the example; run it rather than compiling again.
      - name: Lint — no raw Command::new in prod code
        env:
          LLVM_PROFILE_FILE: /dev/null
        run: ../target/llvm-cov-target/debug/examples/lint-no-raw-command

      - name: Show sccache statistics
        if: always() && env.CI_SCCACHE == 'on'
        run: sccache --show-stats

      - name: Upload the instrumented test archive
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-archive
          path: target/kronn-tests.tar.zst
          if-no-files-found: error
          retention-days: 1
          # Already zstd-compressed.
          compression-level: 0

      # On a warmup miss, validate the exact in-place directories before the
      # cache action persists them in its post-job hook. Cold measurements do
      # not run the hot cache action, and hits already carry this marker.
      - name: Mark bounded compiled backend cache ready
        if: (github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'hot') && steps.verify-backend-cache.outputs.state == 'miss'
        run: |
          for directory in .fingerprint build deps; do
            [ -d "../target/llvm-cov-target/debug/$directory" ]
          done
          find ../target/llvm-cov-target/debug/deps -type f -print -quit | grep -q .
          echo 'schema=3' > ../target/llvm-cov-target/debug/.kronn-backend-cache-v3

  # One share of the tests (nextest `hash:K/N`), run from the shared archive.
  # The archive is extracted inside the checkout: tests locate the repository
  # (templates/) from their executable's path, as in the non-partitioned run.
  test-backend-partition:
    needs: build-backend-tests
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.build-backend-tests.outputs.partitions) }}
    defaults:
      run:
        working-directory: backend
    env:
      PARTITION: ${{ matrix.partition }}
      PARTITION_COUNT: ${{ needs.build-backend-tests.outputs.partition_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download the instrumented test archive
        uses: actions/download-artifact@v4
        with:
          name: backend-test-archive
          path: target

      # Same profile pool as the whole run: LLVM merges one test process's
      # counters into eight files per binary instead of one file per process.
      - name: Run this partition under coverage
        env:
          NEXTEST_PROFILE: ci
          LLVM_PROFILE_FILE: ${{ github.workspace }}/target/partition/profiles/kronn-%8m.profraw
        run: |
          mkdir -p ../target/partition/profiles ../target/nextest-extract
          cargo nextest run --archive-file ../target/kronn-tests.tar.zst \
            --workspace-remap . --extract-to ../target/nextest-extract \
            --partition "hash:$PARTITION/$PARTITION_COUNT"

      # From an archive, nextest keeps its store under the remapped workspace.
      - name: Record the partition manifest
        if: always()
        run: |
          cp target/nextest/ci/junit.xml ../target/partition/junit.xml
          python3 scripts/ci/backend_partitions.py manifest --partition "$PARTITION" \
            --count "$PARTITION_COUNT" --archive ../target/kronn-tests.tar.zst \
            --sha "$(git rev-parse HEAD)" --dir ../target/partition

      - name: Upload the partition's report and profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-partition-${{ matrix.partition }}
          path: target/partition
          if-no-files-found: error
          retention-days: 3

  # Keeps the `test-backend` check name. Fails when the build or any partition
  # did not succeed, when a partition's artifact is missing or comes from
  # another archive, or when a test of the archive's inventory has no result.
  test-backend:
    needs: [build-backend-tests, test-backend-partition]
    if: always() && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PARTITION_COUNT: ${{ needs.build-backend-tests.outputs.partition_count }}
    steps:
      - name: Require the build and every partition
        working-directory: .
        env:
          BUILD_RESULT: ${{ needs.build-backend-tests.result }}
          PARTITIONS_RESULT: ${{ needs.test-backend-partition.result }}
        run: |
          echo "build: $BUILD_RESULT, partitions: $PARTITIONS_RESULT"
          [ "$BUILD_RESULT" = success ] && [ "$PARTITIONS_RESULT" = success ]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install the build's Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.build-backend-tests.outputs.rust_toolchain }}
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Download the instrumented test archive
        uses: actions/download-artifact@v4
        with:
          name: backend-test-archive
          path: target

      - name: Download every partition's report and profiles
        uses: actions/download-artifact@v4
        with:
          pattern: backend-partition-*
          path: target/partitions

      # The inventory comes from the archive itself, not from the partitions.
      # Extracting into llvm-cov-target is where `cargo llvm-cov report
      # --nextest-archive-file` looks for the instrumented binaries.
      - name: List the archive's tests
        env:
          NEXTEST_PROFILE: ci
          LLVM_PROFILE_FILE: /dev/null
        run: |
          mkdir -p ../target/llvm-cov-target
          cargo nextest list --archive-file ../target/kronn-tests.tar.zst \
            --workspace-remap . --extract-to ../target/llvm-cov-target \
            --message-format json > ../target/inventory.json

      - name: Verify every partition, artifact and test
        run: |
          python3 scripts/ci/backend_partitions.py verify --count "$PARTITION_COUNT" \
            --artifacts ../target/partitions --inventory ../target/inventory.json \
            --archive ../target/kronn-tests.tar.zst --sha "$(git rev-parse HEAD)"

      - name: Merge the partitions' coverage
        run: |
          python3 scripts/ci/backend_partitions.py stage --count "$PARTITION_COUNT" \
            --artifacts ../target/partitions --dest ../target/llvm-cov-target
          cargo llvm-cov report --nextest-archive-file ../target/kronn-tests.tar.zst \
            --json --summary-only --output-path ../target/coverage.json

      # The one threshold check: total floor and key-management file floors.
      - name: Coverage floors on the merged data
        run: python3 scripts/ci/coverage_floors.py check ../target/coverage.json --summary-out ../target/coverage-summary.json

      # `coverage_floors.py compare` holds this to a one-partition run of the same commit.
      - name: Upload the coverage counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-summary
          path: target/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  # The ts-rs exports, run from the archive beside the partitions, then the
  # generated.ts drift check. They also run, under coverage, in the partitions.
  test-backend-types:
    needs: build-backend-tests
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download the instrumented test archive
        uses: actions/download-artifact@v4
        with:
          name: backend-test-archive
          path: target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Types — regenerate generated.ts and fail on drift
        env:
          NEXTEST_PROFILE: ci
          LLVM_PROFILE_FILE: /dev/null
        run: |
          mkdir -p ../target/nextest-extract
          cargo nextest run --archive-file ../target/kronn-tests.tar.zst \
            --workspace-remap . --extract-to ../target/nextest-extract \
            -E 'test(export_bindings)'
          node ../frontend/scripts/assemble-generated-types.mjs
          git diff --exit-code ../frontend/src/types/generated.ts

  test-backend-quality:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Dependencies only: Cargo rechecks the checked-out sources (their mtimes
      # are newer than any cached fingerprint), so no stale lint is replayed.
      - name: Cache cargo registry and clippy dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: clippy-v1-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
      # Moved out of `test-backend` so this parallel, still-required gate keeps
      # clippy blocking without holding it on the measured critical path.
      # The generated-type drift check and the raw-command lint run in
      # `test-backend`, on the build the suite already made.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      # nextest does not run doctests; none exist today, and this keeps a
      # future one from being silently skipped.
      - name: cargo test --doc
        run: cargo test --doc
      - name: Lint — no silent TOML unwrap_or_default
        run: |
          VIOLATIONS=$(grep -rn 'parse.*toml.*Value' src/ --include='*.rs' -A3 | grep 'unwrap_or_default' || true)
          test -z "$VIOLATIONS" || { echo "$VIOLATIONS"; exit 1; }
      - name: Lint — no unwrap() inside with_conn closures
        run: |
          python3 scripts/ci/test_lint_with_conn_unwrap.py
          python3 scripts/ci/lint_with_conn_unwrap.py
      - name: Context Budget Gate — agent bootstrap size
        run: |
          python3 scripts/ci/test_context_budget.py
          python3 scripts/ci/context_budget.py
      - name: MCP Surface Budget Gate — tool catalogue size
        run: |
          python3 scripts/ci/test_mcp_surface_budget.py
          python3 scripts/ci/mcp_surface_budget.py
      - name: Gateway body caps — nginx carries every axum body limit
        run: |
          python3 scripts/ci/test_nginx_body_limits.py
          python3 scripts/ci/nginx_body_limits.py
          python3 scripts/ci/test_gateway_frame_src.py
      - name: Tech-debt registry — index rows match open detail files
        run: |
          python3 scripts/ci/test_tech_debt_registry.py
          python3 scripts/ci/tech_debt_registry.py
      - name: Backend partitions and coverage floors — scripts' tests
        run: |
          python3 scripts/ci/test_backend_partitions.py
          python3 scripts/ci/test_coverage_floors.py
      - name: Release body generator — links match attached installers
        run: python3 scripts/ci/test_release_notes.py
      - name: Agent task matrix — every task still reaches its content
        run: python3 scripts/ci/agent_task_matrix.py

  # ── Code-duplication ceiling (jscpd, all 3 languages) ──────────────────
  # Copy-paste detector across Rust + TS/TSX + Python. Baseline 2026-05-29 =
  # The 0.12.0 candidate measures 2.62% duplicated lines. The threshold (3%)
  # lives in `.jscpd.json` — jscpd exits 1 when exceeded, failing this job.
  # Same ratchet philosophy as the coverage floors: pinned just above the
  # current state so accumulating copy-paste fails the build, then lowered
  # again whenever the measured baseline improves. This is the
  # mechanical guard that stops agents (and humans) from merging dup'd code.
  duplication-check:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: jscpd — code duplication ceiling
        # Config (threshold, ignores, formats) is in .jscpd.json at repo root.
        # `--yes` so npx fetches jscpd non-interactively. Pinned major @4 for
        # reproducibility (output/threshold semantics are stable within v4).
        run: npx --yes jscpd@4 backend/src frontend/src backend/scripts --config .jscpd.json

  # Whitespace errors and conflict markers in Markdown, YAML and other files
  # no compiler or linter reads. A PR checkout is the merge commit, whose first
  # parent is the base tip; other triggers compare with the merge base of main.
  diff-hygiene:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: git diff --check against the base
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            scripts/check-diff.sh HEAD^1
          else
            scripts/check-diff.sh
          fi

  # ── Python helper tests ────────────────────────────────────────────────
  # `backend/scripts/disc-introspection-mcp.py` powers the kronn-internal
  # MCP server (5+ agent CLIs invoke it). Its 0.8.5 auto-inherit helpers
  # have no Rust coverage — these unittest cases pin the contract:
  # cache behaviour, missing-env handling, idempotency-collision guard
  # on `source_session_id`. Stdlib only — zero dev deps, sub-second run.
  test-python:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js for CI SLO regression test
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run backend CI SLO unit test
        run: node scripts/ci/test_backend_ci_slo.mjs

      - name: Run MCP helper tests
        run: python3 -m unittest discover -s backend/scripts -p 'test_*.py' -v

      - name: Run document-sidecar build bootstrap tests
        working-directory: backend/sidecars/docs
        run: python3 -m unittest test_build_bundle.py test_parent_watch.py -v

  test-frontend:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        # The pnpm version is read from `frontend/package.json`'s
        # `packageManager` field (currently pnpm@11.21.0). Passing
        # `version:` here on top of it makes `pnpm/action-setup@v4`
        # error with `Multiple versions of pnpm specified` — leave
        # this section as-is so the package.json stays the single
        # source of truth.
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript 7 native check
        run: pnpm typecheck:native

      # TypeScript 7 intentionally ships without the programmatic API consumed
      # by typescript-eslint. Keep the aliased TS6 compiler as an explicit
      # compatibility gate until that ecosystem no longer needs it.
      - name: TypeScript 6 API compatibility check
        run: pnpm typecheck:legacy

      # Keep frontend gates in the frontend job. They previously lived in
      # test-backend solely because that job also builds the Tauri assets, so an
      # ESLint regression appeared in GitHub as a red "backend" check and Rust
      # tests never ran. The exact warning baseline is a ratchet: new warnings
      # fail CI, while cleanup can only lower this number.
      - name: Lint — oxlint fast dual-run
        run: pnpm lint:fast

      - name: Lint — eslint (0 errors, warning budget)
        run: pnpm lint --max-warnings 63

      - name: Lint — i18n key parity (fr/en/es/zh)
        run: pnpm lint:i18n

      # Undefined --kr-* tokens, literal white/black text on a token fill, focus
      # rings removed, and WCAG AA of every text role in every theme.
      - name: Lint — theme tokens and WCAG contrast
        run: pnpm lint:theme

      - name: Run tests with coverage threshold floor
        # Uses `vitest run --coverage` so the `coverage.thresholds` block
        # in `vite.config.ts` enforces the 2026-05-29 baseline floor.
        # Drift below (Statements 67 / Branches 62.5 / Functions 62.5 /
        # Lines 70.5) fails the job — bump the thresholds in lockstep
        # with any future coverage push.
        run: pnpm test:coverage

  test-e2e:
    # Playwright E2E tests — drive a real Chromium against Vite + a live
    # backend. Catches UI regressions that vitest unit tests miss (the
    # 0.6.0 "Create button silent", "JsonData ghost agent", "Quick APIs
    # tab buttons leak" were all UI-only bugs that pure-JS tests can't
    # see).
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    # ── Playwright official container ─────────────────────────────────
    # Chromium + chromium_headless_shell + ffmpeg + all OS deps are BAKED
    # INTO this image. That eliminates the `pnpm exec playwright install`
    # download from `cdn.playwright.dev` entirely — which was the recurring
    # job-killer: that CDN intermittently throttles / TCP-half-closes after
    # the 170 MiB chromium .zip hits 100 %, hanging the step indefinitely
    # until the job timeout, so the browser cache never saved and every run
    # was cold (documented across 3 prior failed runs). The image pull comes
    # from mcr.microsoft.com (fast, reliable, layer-cached by the runner).
    #
    # Image tag MUST match the resolved `@playwright/test` version in
    # frontend/pnpm-lock.yaml (currently 1.59.1) — a mismatch makes the
    # runner think the baked-in browser is the wrong build and re-trigger
    # the very download we're avoiding. Bump both in lockstep.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    # A cold release build took ~17 min and the suite ~8-12 min on the runner:
    # 30 min cancelled a green suite partway through.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Mark workspace git-safe (container runs as root)
        # checkout under root in a container trips git's dubious-ownership
        # guard; whitelist the workspace so later `git` calls (version
        # banner, etc.) don't abort.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install C toolchain + Rust
        # The Playwright image ships Node + browsers + browser OS deps but
        # NOT a C compiler or Rust. The backend needs cc/cmake (rusqlite
        # bundled SQLite, ring) and cargo (via rustup).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Do not wrap this release build in sccache: E2E reliability must not
      # depend on downloading an optional compiler-cache executable.
      - name: Enable corepack (provides pnpm pinned by package.json)
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # NOTE: no `playwright install` step — browsers are pre-baked in the
      # container image at /ms-playwright (PLAYWRIGHT_BROWSERS_PATH is set
      # by the image). `playwright test` finds them with zero download.

      # The dev profile `make dev-backend` serves locally (dependencies at
      # opt-level 1): 69 s for the crate at 4 jobs where `release` took 576 s
      # at 18. ci-build.yml builds the real release profile.
      - name: Cache cargo registry and the e2e backend dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: e2e-dev-v1-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build backend (dev profile)
        working-directory: backend
        run: cargo build --locked --bin kronn

      - name: Start backend in background
        # KRONN_DATA_DIR points at a fresh tmp dir so each CI run starts
        # from a clean SQLite. The backend needs ~5s to boot + first-run
        # config seeding. Container jobs run steps with /bin/sh, so keep this
        # loop POSIX (Bash brace expansion would make only one attempt).
        run: |
          KRONN_DATA_DIR=$(mktemp -d)
          export KRONN_DATA_DIR
          # The WebSocket upgrade accepts only exact origins (KT-1033): name
          # the Vite dev UI the specs drive, as `kronn start-dev` does.
          export KRONN_DEV_UI_URL=http://localhost:5173
          ./target/debug/kronn > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          # Wait for backend to be ready (max 60s).
          backend_ready=0
          attempt=1
          while [ "$attempt" -le 60 ]; do
            if curl -fsS http://localhost:3140/api/setup/status > /dev/null 2>&1; then
              backend_ready=1
              echo "Backend ready after ${attempt}s"
              break
            fi
            if ! kill -0 "$(cat /tmp/backend.pid)" 2>/dev/null; then
              echo "Backend process exited before becoming ready"
              break
            fi
            sleep 1
            attempt=$((attempt + 1))
          done
          if [ "$backend_ready" -ne 1 ]; then
            echo "Backend failed to start"
            tail -100 /tmp/backend.log
            exit 1
          fi

      - name: Bypass first-run setup wizard
        # Without this step, every E2E test on a fresh KRONN_DATA_DIR
        # hits the SetupWizard (App.tsx mounts `<SetupWizard>` when
        # `setupStatus.is_first_run === true` OR `current_step !==
        # "Complete"`). Specs that don't stub `/api/setup/status` (a11y-axe,
        # audit-launch-smoke, codex-real-introspection, project-scan-mcp-sync,
        # ws-reconnect, …) wait on `[data-tour-id="nav-projects"]` from the
        # Dashboard — which never mounts → 60s timeout → 9 failures.
        # Fix: seed a scan path and call /api/setup/complete so the next
        # status read returns `is_first_run: false, current_step: Complete`.
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"paths":["/tmp/kronn-ci-scan"]}' \
            http://localhost:3140/api/setup/scan-paths
          curl -fsS -X POST http://localhost:3140/api/setup/complete
          # Sanity check — fail loud if the wizard is still gating.
          STATUS=$(curl -fsS http://localhost:3140/api/setup/status)
          echo "Setup status after bypass: $STATUS"
          echo "$STATUS" | grep -q '"is_first_run":false' || { echo "Setup bypass did not take effect"; exit 1; }
          echo "$STATUS" | grep -q '"current_step":"Complete"' || { echo "Setup current_step is not Complete"; exit 1; }

      - name: Run E2E tests
        working-directory: frontend
        # Two specs (`project-scan-mcp-sync`, `audit-launch-smoke`) call
        # `mkdtempSync(join(KRONN_REPOS_DIR ?? ~/Repositories, '_kronn_pw_…'))`
        # and throw `ENOENT` if the base dir doesn't exist. On a GitHub
        # runner `~/Repositories` is absent — point `KRONN_REPOS_DIR` at
        # a tmp path we create inline. `RUNNER_TEMP` is auto-cleaned by
        # the runner after the job, no manual cleanup needed.
        run: |
          mkdir -p "$RUNNER_TEMP/kronn-repos"
          export KRONN_REPOS_DIR="$RUNNER_TEMP/kronn-repos"
          pnpm test:e2e
        env:
          CI: "true"

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: /tmp/backend.log
          retention-days: 7

  test-shell:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Verify release version consistency
        run: make check-version

      - name: Run bats tests
        run: make test-shell

  security-scan:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo-audit itself has a regular Actions cache below. Avoid adding a
      # second, network-dependent sccache bootstrap to this security gate.
      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.21

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: backend
        run: cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        # The pnpm version is read from `frontend/package.json`'s
        # `packageManager` field (currently pnpm@11.21.0). Passing
        # `version:` here on top of it makes `pnpm/action-setup@v4`
        # error with `Multiple versions of pnpm specified` — leave
        # this section as-is so the package.json stays the single
        # source of truth.
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        working-directory: frontend
        run: pnpm audit --audit-level=moderate

  ci-quality-gates:
    # Keep every quality job independently parallel, then make their complete
    # result explicit. Configure this one check as required in branch
    # protection: it cannot become green while any listed gate is non-success.
    if: always()
    needs:
      - require-ci-label
      - build-backend-tests
      - test-backend-partition
      - test-backend
      - test-backend-types
      - test-backend-quality
      - duplication-check
      - diff-hygiene
      - test-python
      - test-frontend
      - test-e2e
      - test-shell
      - security-scan
    runs-on: ubuntu-latest
    # Waits up to 50 min for an earlier run's verdict after an unrelated label.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # An unrelated label or a title edit tested nothing: repeat the verdict
      # of the run that tested this pull request, head and base.
      - name: Repeat the verdict already given for this pull request
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-test') && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/previous_gate_verdict.sh ci-test.yml ci-quality-gates
      # The name records what this run tested; the step above reads it back.
      - name: "Gate verdict for ${{ github.event_name }} #${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }} base ${{ github.event.pull_request.base.sha }}"
        if: "!(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-test') && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base)))"
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-test') }}
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Gate results: $RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success")'

  backend-ci-performance:
    # This observer publishes timing evidence but never changes a functional
    # gate result: an SLO breach is a warning, while a real timeout still fails.
    if: always() && inputs.ref == '' && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci-test') && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci-test') || (github.event.action == 'edited' && !github.event.changes.base))))
    needs: [build-backend-tests, test-backend, ci-quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Publish backend critical-path timing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_CACHE_MODE: ${{ inputs.cache_mode || 'hot' }}
          CI_COMPILED_CACHE_HIT: ${{ needs.build-backend-tests.outputs.compiled_cache_hit }}
          CI_COMPILED_CACHE_STATE: ${{ needs.build-backend-tests.outputs.compiled_cache_state }}
        run: node scripts/ci/backend_ci_slo.mjs
