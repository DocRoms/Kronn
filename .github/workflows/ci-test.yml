name: CI Tests

on:
  pull_request:
    # `opened`/`reopened` exist for the require-ci-label guard below: a fresh
    # PR without the label gets a visible RED check instead of zero runs.
    types: [opened, reopened, labeled, unlabeled, synchronize]
  workflow_dispatch:
    inputs:
      cache_mode:
        description: "Measurement mode: hot reuses the normal cache; cold uses a run-scoped cargo cache key."
        required: true
        default: hot
        type: choice
        options: [hot, cold]

# Opt every JS-based action (checkout, setup-node, cache, pnpm/action-setup,
# setup-python) into the Node 24 runtime ahead of GitHub's 2026-06-02 forced
# cutover. Silences the "Node.js 20 actions are deprecated" annotations and
# runs on the faster/newer V8. The pinned action versions (@v4/@v5) already
# ship Node 24-compatible entrypoints — this just flips the runtime selector.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # 0.8.11 — onnxruntime-node's postinstall downloads CUDA GPU binaries from
  # api.nuget.org on linux-x64: never used in CI (browser app → onnxruntime-web,
  # CPU binaries bundled in the npm package) and api.nuget.org regularly times
  # out on GitHub runners — THE recurring flake killing Security Scan /
  # build-frontend at `pnpm install`. Documented knob of the package's install
  # script; also set in frontend/Dockerfile + frontend/.npmrc.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # Anti green-by-skip: every other job is gated on the `ci-test` label, so an
  # unlabeled PR used to show all-skipped — which satisfies required status
  # checks and reads as green. This required job always runs and fails unless
  # the trigger is a manual measurement or the PR retains the label.
  require-ci-label:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require ci-test label for pull requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_CI_TEST_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-test') }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$HAS_CI_TEST_LABEL" = "true" ]; then
            exit 0
          fi
          echo "::error::This PR has no 'ci-test' label — every CI job was SKIPPED (green-by-skip). Add the label to run the suite."
          exit 1

  test-backend:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      compiled_cache_hit: ${{ steps.cache-backend-hot.outputs.cache-hit }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # ── Reclaim disk before the heavy builds ───────────────────────────
      # This single job builds the frontend, runs `cargo test` (normal target)
      # AND `cargo llvm-cov` (a SECOND full build in target/llvm-cov-target/
      # with -C debuginfo=2 instrumentation). Two complete build trees overrun
      # the ~14 GB free on ubuntu-latest → the linker dies with
      # "No space left on device" / "ld terminated with signal 7 [Bus error]".
      # Dropping the preinstalled Android SDK / .NET / GHC frees ~25-30 GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Keep compilation independent from an optional binary cache. The
      # sccache setup action downloads a release asset before any test runs;
      # transient GitHub Releases failures used to abort this whole job and
      # its post-step then failed again while looking for an undefined binary.
      # Store only reusable debug artifacts in an explicit staging tree. In
      # particular, never archive llvm-cov-target, debug/incremental, tmp, or
      # any other transient target subtree: those can be multi-GB and do not
      # make a warm critical-path measurement representative.
      - name: Cache cargo registry and bounded backend build (hot)
        if: github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'hot'
        id: cache-backend-hot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ci-cache/backend-compiled
          key: cargo-hot-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}

      - name: Restore bounded compiled backend artifacts
        if: (github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'hot') && steps.cache-backend-hot.outputs.cache-hit == 'true'
        run: |
          mkdir -p target/debug
          cp -a ../.ci-cache/backend-compiled/. target/debug/

      # These visible, mutually exclusive steps are durable evidence in the
      # Actions jobs API. The observer uses them to exclude first-run warmups
      # from historical hot-cache statistics.
      - name: Record compiled cache hit
        if: (github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'hot') && steps.cache-backend-hot.outputs.cache-hit == 'true'
        run: echo 'Compiled backend cache restored for this hot measurement.'

      - name: Record compiled cache warmup miss
        if: (github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'hot') && steps.cache-backend-hot.outputs.cache-hit != 'true'
        run: echo 'Compiled backend cache was not restored; this run is a warmup and is excluded from hot history.'

      # A cold measurement may populate an isolated Cargo-download cache, but
      # it must never restore compiled artifacts or a broad fallback key.
      - name: Cache cargo registry (cold, isolated)
        if: github.event_name == 'workflow_dispatch' && inputs.cache_mode == 'cold'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-cold-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record cold measurement mode
        if: github.event_name == 'workflow_dispatch' && inputs.cache_mode == 'cold'
        run: "echo 'Cold measurement: compiled backend artifacts are never restored or archived.'"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        # No sccache for clippy — cached artifacts can replay stale lint warnings
        # even when the source has changed (sccache hashes deps/flags, not source content)

      # Run the actual backend suite before unrelated desktop/frontend setup.
      # Previously it sat after apt, pnpm, the production UI build, desktop
      # check and type generation: any one of those gates could abort the job
      # before Rust tests ran, leaving a red "test-backend" with no backend-test
      # verdict at all.
      - name: cargo test — backend (early verdict)
        run: cargo test

      # ── Desktop crate compile-check ────────────────────────────────────
      # backend/ and desktop/src-tauri/ are separate crates (no root
      # workspace). cargo clippy above only covers backend → desktop
      # could silently drift and only break at release time
      # (desktop-build.yml runs on v* tags). This check catches the
      # drift at PR time. The 0.5.0 regression that motivated adding it:
      # a new field on AppState was added + initialized in backend::main
      # but forgotten in desktop::main, so the backend crate compiled
      # fine but `cargo tauri build` broke all 4 desktop OS targets.
      - name: Install Linux deps for desktop compile check
        # webkit2gtk-4.1 / libsoup-3.0 / javascriptcoregtk-4.1 are
        # linked via pkg-config by tauri/glib-sys build scripts. Must
        # match the set installed in desktop-build.yml so both paths
        # compile identically.
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file

      # `include_dir!("../../frontend/dist")` in desktop/src-tauri/src/main.rs
      # is expanded at compile time — Tauri also reads `frontendDist`
      # from tauri.conf.json during `generate_context!`. Both panic if
      # the dir doesn't exist, so we need a real frontend build before
      # the check. We install pnpm + build frontend (production `dist/`).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (provides pnpm pinned by package.json)
        # Node 24 ships corepack — it reads `packageManager` from
        # `frontend/package.json` (pnpm@11.21.0) and fetches that exact
        # version on first invocation. Avoids drift between `npm i -g
        # pnpm` (latest, moving) and the version local devs run.
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend (produces frontend/dist/)
        working-directory: frontend
        run: pnpm build

      - name: cargo check — desktop crate
        working-directory: desktop/src-tauri
        run: cargo check --locked
        # --locked so a drift in Cargo.lock vs Cargo.toml also fails here,
        # not just at release.

      # C1 (plan 0.9) — typegen drift guard. `generated.ts` is now FULLY
      # regenerated from the ts-rs bindings; a PR that changes a Rust model
      # without running `make typegen` fails here on the diff.
      - name: Types — regenerate generated.ts and fail on drift
        # NOTE: this job's default working-directory is `backend` (see defaults
        # at the top of the job) — paths below are relative to it.
        run: |
          cargo test export_bindings -- --nocapture
          node ../frontend/scripts/assemble-generated-types.mjs
          git diff --exit-code ../frontend/src/types/generated.ts || {
            echo "::error::frontend/src/types/generated.ts drifted from the Rust models — run 'make typegen' and commit the result."
            exit 1
          }

      # ── Anti-regression lints ─────────────────────────────────────────
      #
      # These grep-based checks catch patterns that clippy can't:
      #
      # 1. std::process::Command::new — On Windows, every Command::new
      #    spawns a visible console window. All production code MUST use
      #    crate::core::cmd::{sync_cmd, async_cmd} which apply
      #    CREATE_NO_WINDOW. Test code (#[cfg(test)]) is exempt.
      #
      # 2. .unwrap_or_default() after .parse::<toml::Value>() — This
      #    was the root cause of a critical bug where Codex config.toml
      #    was silently replaced with an empty table on parse error,
      #    destroying [model_providers] and user auth. Use explicit error
      #    handling (see load_codex_config_for_merge pattern).
      - name: Lint — no raw Command::new in prod code
        run: |
          # On Windows every Command::new flashes a console window. Production
          # code must use crate::core::cmd::{sync_cmd, async_cmd}.
          #
          # Pre-0.8.2 this was a `grep 'Command::new'` bash loop that
          # false-positived on string literals — the Security audit prompt
          # mentions the pattern as something to look for in user code, and
          # the grep saw the literal substring and failed CI.
          #
          # The check is now an AST-aware Rust binary (syn-based) — see
          # examples/lint-no-raw-command.rs. Strings/comments are invisible
          # to the AST, so the whole class of false positives is gone.
          # cfg(test) modules / fns are skipped recursively.
          cargo run --example lint-no-raw-command --quiet

      - name: Lint — no silent TOML unwrap_or_default
        run: |
          # Catch the dangerous pattern: .parse::<toml::Value>() ... .unwrap_or_default()
          # which silently drops user config on parse errors.
          VIOLATIONS=$(grep -rn 'parse.*toml.*Value' src/ --include='*.rs' -A3 \
            | grep 'unwrap_or_default' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Found .unwrap_or_default() on TOML parse result — handle errors explicitly:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✓ No silent TOML unwrap_or_default"

      - name: Lint — no unwrap() inside with_conn closures
        run: |
          # stab-1 — a panic inside a with_conn closure poisons the shared
          # DB mutex (recovered since 0.8.11, but still one failed request).
          # Baseline is ZERO in prod code: keep it that way.
          python3 scripts/ci/test_lint_with_conn_unwrap.py
          python3 scripts/ci/lint_with_conn_unwrap.py

      - name: Context Budget Gate — agent bootstrap size
        run: |
          # KT-191 — the mandatory bootstrap is paid by EVERY session before any
          # useful work, so it is a product cost. Ratchet: no growth until the
          # re-split lands; the remaining debt to target is printed each run.
          python3 scripts/ci/test_context_budget.py
          python3 scripts/ci/context_budget.py

      - name: MCP Surface Budget Gate — tool catalogue size
        run: |
          # KT-192 — the tool catalogue is injected before any work is exchanged,
          # so it is the same kind of unconditional cost as the bootstrap. Same
          # ratchet rule: lower a ceiling when a reduction lands, never raise one
          # to go green.
          python3 scripts/ci/test_mcp_surface_budget.py
          python3 scripts/ci/mcp_surface_budget.py

      - name: Agent task matrix — every task still reaches its content
        run: |
          # KT-191 DoD 7 — shrinking the bootstrap is only safe if each
          # representative task can still reach what it needs. Checks the router
          # tables, not just whether the text exists somewhere.
          python3 scripts/ci/agent_task_matrix.py

      # ── Coverage threshold floor ────────────────────────────────
      # Pinned to the integer floor demonstrated by the 0.12.0 candidate
      # (Regions 83.95 / Functions 83.66 / Lines 83.48). This keeps a
      # sub-point margin for harmless instrumentation drift while making
      # every full percentage point of coverage a durable quality gain.
      # When a future push raises the real coverage, bump these in
      # lockstep — DON'T lower them, that defeats the purpose.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov — enforce coverage floor
        run: |
          cargo llvm-cov --lib --tests --summary-only \
            --fail-under-lines 83 \
            --fail-under-functions 83 \
            --fail-under-regions 83

      # Scoped, stricter floor on the encryption-key / config-persistence modules
      # (2026-06-30 secret-loss hardening). Reuses the instrumented build from the
      # step above (cargo llvm-cov report, no rebuild). Separate from the repo-wide
      # floor — a regression that could silently lose the key fails CI here first.
      - name: cargo llvm-cov — key-management scoped floor
        # The job's default working-directory is `backend/` — the script lives at
        # the repo root and handles its own `cd`, so reference it relatively.
        run: ../scripts/check-keymgmt-coverage.sh

      # ── Desktop compilation check ───────────────────────────────────
      # The Tauri desktop app (desktop/src-tauri/) imports the backend as
      # a lib. Signature changes in the backend break the desktop build
      # but NOT cargo test in backend/. This check catches it early.
      # `cargo check` only type-checks (no link, no Tauri system deps).
      - name: cargo check desktop (type-check only)
        working-directory: desktop/src-tauri
        run: cargo check --lib 2>/dev/null || cargo check 2>&1 | head -40

      # The cache post-step saves this staging directory, not target/. Keep the
      # selection deliberately bounded to ordinary Cargo debug artifacts.
      - name: Stage bounded compiled backend artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'hot'
        run: |
          mkdir -p ../.ci-cache/backend-compiled
          for directory in .fingerprint build deps; do
            if [ -d "target/debug/$directory" ]; then
              mkdir -p "../.ci-cache/backend-compiled/$directory"
              cp -a "target/debug/$directory/." "../.ci-cache/backend-compiled/$directory/"
            fi
          done

  # ── Code-duplication ceiling (jscpd, all 3 languages) ──────────────────
  # Copy-paste detector across Rust + TS/TSX + Python. Baseline 2026-05-29 =
  # The 0.12.0 candidate measures 2.62% duplicated lines. The threshold (3%)
  # lives in `.jscpd.json` — jscpd exits 1 when exceeded, failing this job.
  # Same ratchet philosophy as the coverage floors: pinned just above the
  # current state so accumulating copy-paste fails the build, then lowered
  # again whenever the measured baseline improves. This is the
  # mechanical guard that stops agents (and humans) from merging dup'd code.
  duplication-check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: jscpd — code duplication ceiling
        # Config (threshold, ignores, formats) is in .jscpd.json at repo root.
        # `--yes` so npx fetches jscpd non-interactively. Pinned major @4 for
        # reproducibility (output/threshold semantics are stable within v4).
        run: npx --yes jscpd@4 backend/src frontend/src backend/scripts --config .jscpd.json

  # ── Python helper tests ────────────────────────────────────────────────
  # `backend/scripts/disc-introspection-mcp.py` powers the kronn-internal
  # MCP server (5+ agent CLIs invoke it). Its 0.8.5 auto-inherit helpers
  # have no Rust coverage — these unittest cases pin the contract:
  # cache behaviour, missing-env handling, idempotency-collision guard
  # on `source_session_id`. Stdlib only — zero dev deps, sub-second run.
  test-python:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js for CI SLO regression test
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run backend CI SLO unit test
        run: node scripts/ci/test_backend_ci_slo.mjs

      - name: Run MCP helper tests
        run: python3 -m unittest discover -s backend/scripts -p 'test_*.py' -v

      - name: Run document-sidecar build bootstrap tests
        working-directory: backend/sidecars/docs
        run: python3 -m unittest test_build_bundle.py -v

  # A Linux unit test cannot prove that CPython can load MSYS2's DLL graph.
  # Exercise the exact Windows release-sidecar path on every tested PR so a
  # broken installer cannot remain hidden until the next version tag.
  test-docs-sidecar-windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Windows document-rendering libraries
        id: msys2
        uses: msys2/setup-msys2@v2.32.0
        with:
          update: false
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-pango

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/sidecars/docs/pyproject.toml

      - name: Build frozen document exporter
        id: docs-sidecar
        run: node desktop/scripts/build-docs-sidecar.mjs
        env:
          KRONN_DOCS_NATIVE_LIB_DIRS: ${{ format('{0}/ucrt64/bin', steps.msys2.outputs.msys2-location) }}

      - name: Smoke-test frozen PDF and DOCX exports
        id: docs-smoke
        run: >-
          python backend/sidecars/docs/smoke_bundle.py
          desktop/src-tauri/resources/docs-sidecar/kronn-docs/kronn-docs.exe
          --diagnostics target/docs-sidecar-smoke.log

      - name: Upload sidecar diagnostics on failure
        if: always() && (steps.docs-sidecar.outcome == 'failure' || steps.docs-smoke.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: docs-sidecar-windows-diagnostics
          path: |
            target/docs-sidecar-bootstrap.log
            target/docs-sidecar-pyinstaller/*.spec
            target/docs-sidecar-pyinstaller/work/warn-*.txt
            target/docs-sidecar-pyinstaller/work/xref-*.html
            target/docs-sidecar-smoke.log
          if-no-files-found: warn
          retention-days: 7

  test-frontend:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        # The pnpm version is read from `frontend/package.json`'s
        # `packageManager` field (currently pnpm@11.21.0). Passing
        # `version:` here on top of it makes `pnpm/action-setup@v4`
        # error with `Multiple versions of pnpm specified` — leave
        # this section as-is so the package.json stays the single
        # source of truth.
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript 7 native check
        run: pnpm typecheck:native

      # TypeScript 7 intentionally ships without the programmatic API consumed
      # by typescript-eslint. Keep the aliased TS6 compiler as an explicit
      # compatibility gate until that ecosystem no longer needs it.
      - name: TypeScript 6 API compatibility check
        run: pnpm typecheck:legacy

      # Keep frontend gates in the frontend job. They previously lived in
      # test-backend solely because that job also builds the Tauri assets, so an
      # ESLint regression appeared in GitHub as a red "backend" check and Rust
      # tests never ran. The exact warning baseline is a ratchet: new warnings
      # fail CI, while cleanup can only lower this number.
      - name: Lint — oxlint fast dual-run
        run: pnpm lint:fast

      - name: Lint — eslint (0 errors, warning budget)
        run: pnpm lint --max-warnings 72

      - name: Lint — i18n key parity (fr/en/es/zh)
        run: pnpm lint:i18n

      - name: Run tests with coverage threshold floor
        # Uses `vitest run --coverage` so the `coverage.thresholds` block
        # in `vite.config.ts` enforces the 2026-05-29 baseline floor.
        # Drift below (Statements 67 / Branches 62.5 / Functions 62.5 /
        # Lines 70.5) fails the job — bump the thresholds in lockstep
        # with any future coverage push.
        run: pnpm test:coverage

  test-e2e:
    # Playwright E2E tests — drive a real Chromium against Vite + a live
    # backend. Catches UI regressions that vitest unit tests miss (the
    # 0.6.0 "Create button silent", "JsonData ghost agent", "Quick APIs
    # tab buttons leak" were all UI-only bugs that pure-JS tests can't
    # see).
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    runs-on: ubuntu-latest
    # ── Playwright official container ─────────────────────────────────
    # Chromium + chromium_headless_shell + ffmpeg + all OS deps are BAKED
    # INTO this image. That eliminates the `pnpm exec playwright install`
    # download from `cdn.playwright.dev` entirely — which was the recurring
    # job-killer: that CDN intermittently throttles / TCP-half-closes after
    # the 170 MiB chromium .zip hits 100 %, hanging the step indefinitely
    # until the job timeout, so the browser cache never saved and every run
    # was cold (documented across 3 prior failed runs). The image pull comes
    # from mcr.microsoft.com (fast, reliable, layer-cached by the runner).
    #
    # Image tag MUST match the resolved `@playwright/test` version in
    # frontend/pnpm-lock.yaml (currently 1.59.1) — a mismatch makes the
    # runner think the baked-in browser is the wrong build and re-trigger
    # the very download we're avoiding. Bump both in lockstep.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace git-safe (container runs as root)
        # checkout under root in a container trips git's dubious-ownership
        # guard; whitelist the workspace so later `git` calls (version
        # banner, etc.) don't abort.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install C toolchain + Rust
        # The Playwright image ships Node + browsers + browser OS deps but
        # NOT a C compiler or Rust. The backend needs cc/cmake (rusqlite
        # bundled SQLite, ring) and cargo (via rustup).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Do not wrap this release build in sccache: E2E reliability must not
      # depend on downloading an optional compiler-cache executable.
      - name: Enable corepack (provides pnpm pinned by package.json)
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # NOTE: no `playwright install` step — browsers are pre-baked in the
      # container image at /ms-playwright (PLAYWRIGHT_BROWSERS_PATH is set
      # by the image). `playwright test` finds them with zero download.

      - name: Build backend (release)
        working-directory: backend
        run: cargo build --release --bin kronn

      - name: Start backend in background
        # KRONN_DATA_DIR points at a fresh tmp dir so each CI run starts
        # from a clean SQLite. The backend needs ~5s to boot + first-run
        # config seeding. Container jobs run steps with /bin/sh, so keep this
        # loop POSIX (Bash brace expansion would make only one attempt).
        run: |
          KRONN_DATA_DIR=$(mktemp -d)
          export KRONN_DATA_DIR
          ./target/release/kronn > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          # Wait for backend to be ready (max 60s).
          backend_ready=0
          attempt=1
          while [ "$attempt" -le 60 ]; do
            if curl -fsS http://localhost:3140/api/setup/status > /dev/null 2>&1; then
              backend_ready=1
              echo "Backend ready after ${attempt}s"
              break
            fi
            if ! kill -0 "$(cat /tmp/backend.pid)" 2>/dev/null; then
              echo "Backend process exited before becoming ready"
              break
            fi
            sleep 1
            attempt=$((attempt + 1))
          done
          if [ "$backend_ready" -ne 1 ]; then
            echo "Backend failed to start"
            tail -100 /tmp/backend.log
            exit 1
          fi

      - name: Bypass first-run setup wizard
        # Without this step, every E2E test on a fresh KRONN_DATA_DIR
        # hits the SetupWizard (App.tsx mounts `<SetupWizard>` when
        # `setupStatus.is_first_run === true` OR `current_step !==
        # "Complete"`). Specs that don't stub `/api/setup/status` (a11y-axe,
        # audit-launch-smoke, codex-real-introspection, project-scan-mcp-sync,
        # ws-reconnect, …) wait on `[data-tour-id="nav-projects"]` from the
        # Dashboard — which never mounts → 60s timeout → 9 failures.
        # Fix: seed a scan path and call /api/setup/complete so the next
        # status read returns `is_first_run: false, current_step: Complete`.
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"paths":["/tmp/kronn-ci-scan"]}' \
            http://localhost:3140/api/setup/scan-paths
          curl -fsS -X POST http://localhost:3140/api/setup/complete
          # Sanity check — fail loud if the wizard is still gating.
          STATUS=$(curl -fsS http://localhost:3140/api/setup/status)
          echo "Setup status after bypass: $STATUS"
          echo "$STATUS" | grep -q '"is_first_run":false' || { echo "Setup bypass did not take effect"; exit 1; }
          echo "$STATUS" | grep -q '"current_step":"Complete"' || { echo "Setup current_step is not Complete"; exit 1; }

      - name: Run E2E tests
        working-directory: frontend
        # Two specs (`project-scan-mcp-sync`, `audit-launch-smoke`) call
        # `mkdtempSync(join(KRONN_REPOS_DIR ?? ~/Repositories, '_kronn_pw_…'))`
        # and throw `ENOENT` if the base dir doesn't exist. On a GitHub
        # runner `~/Repositories` is absent — point `KRONN_REPOS_DIR` at
        # a tmp path we create inline. `RUNNER_TEMP` is auto-cleaned by
        # the runner after the job, no manual cleanup needed.
        run: |
          mkdir -p "$RUNNER_TEMP/kronn-repos"
          export KRONN_REPOS_DIR="$RUNNER_TEMP/kronn-repos"
          pnpm test:e2e
        env:
          CI: "true"

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: /tmp/backend.log
          retention-days: 7

  test-shell:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify release version consistency
        run: make check-version

      - name: Run bats tests
        run: make test-shell

  security-scan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo-audit itself has a regular Actions cache below. Avoid adding a
      # second, network-dependent sccache bootstrap to this security gate.
      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.21

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: backend
        run: cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        # The pnpm version is read from `frontend/package.json`'s
        # `packageManager` field (currently pnpm@11.21.0). Passing
        # `version:` here on top of it makes `pnpm/action-setup@v4`
        # error with `Multiple versions of pnpm specified` — leave
        # this section as-is so the package.json stays the single
        # source of truth.
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        working-directory: frontend
        run: pnpm audit --audit-level=moderate

  # ── KT-373 — portability of the disk-maintenance surface ────────────────────
  #
  # `test-backend` proves this code on Linux only. The guards it contains are
  # path- and filesystem-shaped — symlinks vs. reparse points, permission
  # semantics, free-space reporting — which is exactly the class of behaviour a
  # single OS cannot vouch for. `desktop-build.yml` compiles for all three, but
  # compiling is not executing, and after the 2026-08-21 disk incident this gate
  # is not one to relax.
  #
  # Deliberately NOT the whole backend suite duplicated three times: only the
  # modules whose behaviour actually differs per platform. Linux stays covered by
  # `test-backend`; this adds the two hosts nothing else runs on.
  test-backend-portability:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: portability-${{ matrix.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: portability-${{ matrix.os }}-

      - name: Worktree lifecycle and disk guards
        run: cargo test --lib core::worktree

      - name: Disk maintenance surface
        run: cargo test --lib api::maintenance

      - name: Cleanup authorisation from durable state
        run: cargo test --lib db::orchestration

  ci-quality-gates:
    # Keep every quality job independently parallel, then make their complete
    # result explicit. Configure this one check as required in branch
    # protection: it cannot become green while any listed gate is non-success.
    if: always()
    needs:
      - require-ci-label
      - test-backend
      - duplication-check
      - test-python
      - test-docs-sidecar-windows
      - test-frontend
      - test-e2e
      - test-shell
      - security-scan
      - test-backend-portability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail when any quality gate did not succeed
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Quality gate results: $RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success")'

  backend-ci-performance:
    # This observer publishes timing evidence but never changes a functional
    # gate result: an SLO breach is a warning, while a real timeout still fails.
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-test'))
    needs: [test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish backend critical-path timing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_CACHE_MODE: ${{ inputs.cache_mode || 'hot' }}
          CI_COMPILED_CACHE_HIT: ${{ needs.test-backend.outputs.compiled_cache_hit }}
        run: node scripts/ci/backend_ci_slo.mjs
