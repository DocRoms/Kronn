name: Dependency review

on:
  schedule:
    # Weekly by default. Project-level checks remain independently configurable
    # in Kronn's Project overview.
    - cron: '17 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  review:
    name: Security alerts and ordinary updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Security checks are deliberately separate and visually prior to
      # ordinary version drift. The individual steps continue so all three
      # graphs are reported; the aggregate step below then fails the workflow.
      - name: Security — audit backend Rust dependencies
        id: audit-backend
        working-directory: backend
        continue-on-error: true
        run: cargo audit

      - name: Security — audit desktop Rust dependencies
        id: audit-desktop
        working-directory: desktop/src-tauri
        continue-on-error: true
        run: cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Security — audit frontend dependencies
        id: audit-frontend
        working-directory: frontend
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

      # These commands only resolve/report available versions. `--dry-run` is
      # mandatory for Cargo; no install/update command is ever executed.
      - name: Updates — review backend Rust version drift
        working-directory: backend
        continue-on-error: true
        run: cargo update --dry-run --verbose --color never

      - name: Updates — review desktop Rust version drift
        working-directory: desktop/src-tauri
        continue-on-error: true
        run: cargo update --dry-run --verbose --color never

      - name: Updates — review frontend version drift
        working-directory: frontend
        continue-on-error: true
        run: pnpm outdated --format json

      - name: Review policy
        run: |
          echo "Dependency review completed."
          echo "Security findings are reported separately from ordinary version drift."
          echo "No dependency was updated automatically."

      - name: Enforce security gate
        env:
          BACKEND_AUDIT_OUTCOME: ${{ steps.audit-backend.outcome }}
          DESKTOP_AUDIT_OUTCOME: ${{ steps.audit-desktop.outcome }}
          FRONTEND_AUDIT_OUTCOME: ${{ steps.audit-frontend.outcome }}
        run: |
          failed=0

          if [ "$BACKEND_AUDIT_OUTCOME" = "failure" ]; then
            echo "::error title=Backend dependency audit failed::cargo audit reported a vulnerability or could not complete in backend/."
            failed=1
          fi

          if [ "$DESKTOP_AUDIT_OUTCOME" = "failure" ]; then
            echo "::error title=Desktop dependency audit failed::cargo audit reported a vulnerability or could not complete in desktop/src-tauri/."
            failed=1
          fi

          if [ "$FRONTEND_AUDIT_OUTCOME" = "failure" ]; then
            echo "::error title=Frontend dependency audit failed::pnpm audit reported a moderate-or-higher vulnerability or could not complete in frontend/."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Review the named Security step or steps before releasing."
            exit 1
          fi

          echo "All dependency security audits passed."
